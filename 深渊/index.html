<!DOCTYPE html>
<!-- 深渊 · ABYSS — 单文件版：HTML + CSS + JS 全部内联，双击即可运行 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<meta name="description" content="深渊 ABYSS — 一款关于向下挖掘的增量游戏">
<title>深渊 · ABYSS</title>
<style>
/* ==========================================================================
   深渊 · ABYSS — 样式表
   深色主题，配色随深度由 JS 改写 --accent / --bg-deep 等 CSS 变量。
   移动端优先：所有可点击元素触控区 ≥ 44px。
   ========================================================================== */

:root{
  /* 主题变量（JS 会随矿层改写 --accent / --accent2） */
  --accent:   #ffa63a;   /* 琥珀：地表 / 暖调 */
  --accent2:  #38e0d0;   /* 青色：深渊 / 冷调 */
  --bg:       #07080a;
  --panel:    #0d0f13;
  --panel2:   #14171d;
  --panel3:   #1b2027;
  --line:     #232a33;
  --txt:      #e8edf3;
  --dim:      #8b96a5;
  --dim2:     #5d6672;
  --ok:       #6ede8a;
  --bad:      #ff6b6b;
  --hud-h:    92px;
  --panel-h:  46vh;
  --safe-b:   env(safe-area-inset-bottom, 0px);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  margin:0; padding:0; height:100%; overflow:hidden;
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.45;
  overscroll-behavior:none;
  -webkit-user-select:none; user-select:none;
  touch-action:manipulation;
}

#app{ position:fixed; inset:0; }

/* ---------- 3D 画布 ---------- */
#gl{
  position:absolute; top:0; left:0;
  width:100%; height:calc(100% - var(--panel-h));
  display:block; background:#05060a;
  touch-action:none;
}
/* 颗粒噪点（纯 CSS，静态，不耗性能） */
#grain{
  position:absolute; top:0; left:0; width:100%;
  height:calc(100% - var(--panel-h));
  pointer-events:none; opacity:.16; mix-blend-mode:overlay;
  background-image:
    radial-gradient(rgba(255,255,255,.35) .5px, transparent .5px),
    radial-gradient(rgba(255,255,255,.20) .5px, transparent .5px);
  background-size:3px 3px, 7px 7px;
  background-position:0 0, 2px 3px;
}
/* 深渊压暗层：深度越大越黑（JS 调整 opacity） */
#dark{
  position:absolute; top:0; left:0; width:100%;
  height:calc(100% - var(--panel-h));
  pointer-events:none; opacity:0; transition:opacity 1.2s linear;
  background:radial-gradient(120% 80% at 50% 40%, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 60%, rgba(0,0,0,.92) 100%);
}

/* ---------- 顶部 HUD ---------- */
#hud{
  position:absolute; top:0; left:0; right:0;
  padding:calc(env(safe-area-inset-top, 0px) + 8px) 10px 0;
  background:linear-gradient(180deg, rgba(5,6,9,.92) 0%, rgba(5,6,9,.72) 60%, rgba(5,6,9,0) 100%);
  pointer-events:none; z-index:6;
}
.hud-main{ display:flex; align-items:flex-end; gap:14px; }
.stat{ display:flex; align-items:baseline; gap:5px; }
.stat .k{ font-size:11px; color:var(--dim); letter-spacing:.06em; }
.stat .v{ font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.stat .u{ font-size:11px; color:var(--dim); }
.stat-depth .v{
  font-size:30px; line-height:1; color:var(--accent);
  text-shadow:0 0 18px color-mix(in srgb, var(--accent) 45%, transparent);
}
.amber{ color:var(--accent); }
.cyan{  color:var(--accent2); }

.hud-sub{ display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
.chip{
  font-size:11px; color:var(--dim);
  background:rgba(20,23,29,.78); border:1px solid var(--line);
  border-radius:999px; padding:3px 9px; display:flex; gap:4px; align-items:baseline;
  font-variant-numeric:tabular-nums;
}
.chip span{ color:var(--txt); font-weight:600; }
.chip .k{ color:var(--dim); font-weight:400; }
.chip-layer{ color:var(--accent); border-color:color-mix(in srgb, var(--accent) 40%, var(--line)); }
.chip-log{ color:var(--accent2); border-color:color-mix(in srgb, var(--accent2) 35%, var(--line)); }
.chip-log.near{ animation:breathe 1.6s ease-in-out infinite; }

#depthBar{
  margin-top:8px; height:3px; border-radius:2px;
  background:rgba(255,255,255,.07); overflow:hidden;
}
#depthBarFill{
  display:block; height:100%; width:0%;
  background:linear-gradient(90deg, var(--accent), var(--accent2));
  transition:width .25s linear;
}

/* ---------- 挖掘按钮 ---------- */
#digBtn{
  position:absolute; z-index:7;
  right:12px; bottom:calc(var(--panel-h) + 12px);
  width:96px; height:96px; border-radius:50%;
  border:2px solid color-mix(in srgb, var(--accent) 65%, transparent);
  background:radial-gradient(circle at 40% 32%, rgba(255,255,255,.14), rgba(10,11,14,.94) 62%);
  color:var(--txt); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:1px;
  box-shadow:0 8px 26px rgba(0,0,0,.55), 0 0 22px color-mix(in srgb, var(--accent) 22%, transparent);
  cursor:pointer; padding:0;
}
#digBtn .dig-core{ font-size:30px; line-height:1; filter:drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 60%, transparent)); }
#digBtn .dig-label{ font-size:12px; letter-spacing:.28em; color:var(--dim); }
#digBtn .dig-sub{ font-size:11px; color:var(--accent); font-variant-numeric:tabular-nums; }
#digBtn:active{ transform:scale(.93); }
#digBtn.pulse{ animation:digPulse .18s ease-out; }
@keyframes digPulse{ 0%{transform:scale(1)} 45%{transform:scale(.9)} 100%{transform:scale(1)} }

/* ---------- 底部面板 ---------- */
#panel{
  position:absolute; left:0; right:0; bottom:0;
  height:var(--panel-h); z-index:8;
  display:flex; flex-direction:column;
  background:linear-gradient(180deg, rgba(13,15,19,.96) 0%, #0b0d11 100%);
  border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
  box-shadow:0 -10px 30px rgba(0,0,0,.5);
}
#tabs{ display:flex; flex:0 0 auto; border-bottom:1px solid var(--line); }
.tab{
  flex:1; min-height:46px; background:none; border:0; border-bottom:2px solid transparent;
  color:var(--dim); font-size:14px; font-weight:600; cursor:pointer;
}
.tab.active{ color:var(--accent); border-bottom-color:var(--accent); }
#tabBody{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.tabpane{ display:none; padding:10px 10px 24px; }
.tabpane.active{ display:block; }

/* ---------- 卡片 ---------- */
.card{
  background:var(--panel2); border:1px solid var(--line);
  border-radius:12px; padding:10px 12px; margin-bottom:10px;
}
.card-title{
  font-size:13px; font-weight:700; letter-spacing:.04em;
  display:flex; justify-content:space-between; align-items:center; gap:8px;
}
.card-title small{ font-weight:400; color:var(--dim); font-size:11px; }
.card-note{ font-size:11.5px; color:var(--dim); margin-top:5px; line-height:1.5; }
.row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px; }
.kv{ display:flex; gap:6px; align-items:baseline; font-size:12px; color:var(--dim); }
.kv b{ color:var(--txt); font-size:14px; font-variant-numeric:tabular-nums; }
.mono{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }

/* ---------- 按钮 ---------- */
.btn{
  min-height:44px; padding:0 14px; border-radius:10px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel3); color:var(--txt);
  font-size:13px; font-weight:600; display:inline-flex;
  align-items:center; justify-content:center; gap:6px;
}
.btn:active{ transform:translateY(1px); }
.btn.primary{ background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #000), color-mix(in srgb, var(--accent) 62%, #000)); color:#14100a; border-color:transparent; }
.btn.cyan{ background:linear-gradient(180deg, color-mix(in srgb, var(--accent2) 88%, #000), color-mix(in srgb, var(--accent2) 60%, #000)); color:#04140f; border-color:transparent; }
.btn.ghost{ background:transparent; color:var(--dim); }
.btn.danger{ background:transparent; color:var(--bad); border-color:color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.block{ width:100%; }
.btn:disabled{ opacity:.42; cursor:not-allowed; }
.btn.breathe{ animation:breathe 1.9s ease-in-out infinite; }
@keyframes breathe{
  0%,100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 42%, transparent); }
  50%    { box-shadow:0 0 0 7px color-mix(in srgb, var(--accent) 0%, transparent); }
}
.switch{
  min-height:44px; min-width:64px; padding:0 10px; border-radius:10px;
  border:1px solid var(--line); background:var(--panel3); color:var(--dim);
  font-size:12px; font-weight:700; cursor:pointer;
}
.switch.on{ color:#14100a; background:var(--accent); border-color:transparent; }

/* ---------- 购买列表 ---------- */
.list-head{
  font-size:11px; color:var(--dim2); letter-spacing:.18em;
  margin:12px 0 6px 2px;
}
.item{
  display:grid; grid-template-columns:42px 1fr; gap:4px 10px;
  padding:10px; margin-bottom:8px;
  background:var(--panel2); border:1px solid var(--line); border-radius:12px;
}
.item.locked{ opacity:.5; }
.item-icon{
  width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-size:22px; background:var(--panel3); border:1px solid var(--line);
}
.item-main{ min-width:0; }
.item-title{
  font-size:14px; font-weight:700; display:flex; gap:6px; align-items:baseline; flex-wrap:wrap;
}
.item-title .lvl{ font-size:11px; color:var(--accent); font-weight:600; }
.item-desc{ font-size:11px; color:var(--dim); margin-top:2px; line-height:1.4; }
.item-meta{ font-size:11.5px; color:var(--accent2); margin-top:3px; font-variant-numeric:tabular-nums; }
.item-meta .muted{ color:var(--dim2); }
.item-buy{ grid-column:1/-1; display:flex; gap:6px; margin-top:6px; }
.buy{
  flex:1 1 0; min-height:44px; padding:2px 4px; border-radius:10px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel3); color:var(--txt);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  font-variant-numeric:tabular-nums; overflow:hidden;
}
.buy b{ font-size:12px; font-weight:700; }
.buy span{ font-size:10.5px; color:var(--dim); }
.buy.can{ border-color:color-mix(in srgb, var(--accent) 55%, transparent); color:var(--accent); }
.buy.can span{ color:color-mix(in srgb, var(--accent) 70%, #fff); }
.buy.can{ animation:breathe 2.4s ease-in-out infinite; }
.buy:disabled{ opacity:.4; cursor:not-allowed; animation:none; }
.buy.max b{ color:var(--accent2); }

/* ---------- 档案 ---------- */
.log-item{
  display:flex; gap:10px; align-items:center;
  padding:11px 10px; margin-bottom:7px; min-height:56px;
  background:var(--panel2); border:1px solid var(--line); border-radius:10px; cursor:pointer;
}
.log-item .no{ font-size:11px; color:var(--dim2); min-width:44px; font-family:ui-monospace,monospace; }
.log-item .tt{ font-size:13px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.log-item .dp{ font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums; }
.log-item.locked{ opacity:.55; }
.log-item.locked .tt{ color:var(--dim2); letter-spacing:.02em; font-family:ui-monospace,monospace; }
.log-item.fresh{ border-color:var(--accent2); box-shadow:0 0 0 1px color-mix(in srgb, var(--accent2) 30%, transparent) inset; }
.ach-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:7px; }
.ach{
  padding:9px 10px; border-radius:10px; border:1px solid var(--line);
  background:var(--panel2); min-height:56px;
}
.ach.got{ border-color:color-mix(in srgb, var(--accent) 45%, transparent); background:color-mix(in srgb, var(--accent) 8%, var(--panel2)); }
.ach .an{ font-size:12.5px; font-weight:700; }
.ach .ad{ font-size:10.5px; color:var(--dim); margin-top:2px; }
.ach.lock .an{ color:var(--dim2); }

/* ---------- 设置 ---------- */
.set-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
.set-row .lbl{ font-size:13px; }
.set-row .lbl small{ display:block; font-size:10.5px; color:var(--dim2); }
input[type=range]{ width:150px; height:44px; accent-color:var(--accent); }
.seg{ display:flex; gap:5px; }
.seg .btn{ min-height:44px; padding:0 11px; font-size:12px; }
.seg .btn.on{ background:var(--accent); color:#14100a; border-color:transparent; }
textarea{
  width:100%; min-height:120px; border-radius:10px; border:1px solid var(--line);
  background:#080a0d; color:var(--txt); padding:10px; font-size:11px;
  font-family:ui-monospace,monospace; resize:vertical;
}

/* ---------- 购买特效：全屏闪光（DOM 层，零 GPU 成本） ---------- */
.fx-flash{
  position:absolute; left:0; right:0; top:0;
  height:calc(100% - var(--panel-h));
  pointer-events:none; opacity:0; z-index:5; display:none;
  mix-blend-mode:screen; will-change:opacity;
}

/* ---------- 浮动数字 ---------- */
#floaters{ position:absolute; inset:0; pointer-events:none; z-index:9; overflow:hidden; }
.floater{
  position:absolute; transform:translate(-50%,-50%);
  font-size:16px; font-weight:800; color:var(--accent);
  text-shadow:0 2px 8px rgba(0,0,0,.85);
  animation:floatUp 1s cubic-bezier(.2,.7,.3,1) forwards;
  white-space:nowrap; font-variant-numeric:tabular-nums;
}
.floater.ore{ color:var(--accent2); font-size:14px; }
.floater.coin{ color:#ffe08a; font-size:14px; }
.floater.crit{ color:#fff; font-size:22px; }
@keyframes floatUp{
  0%{ opacity:0; transform:translate(-50%,-50%) scale(.7); }
  18%{ opacity:1; transform:translate(-50%,-70%) scale(1.06); }
  100%{ opacity:0; transform:translate(-50%,-190%) scale(1); }
}

/* ---------- 弹窗 ---------- */
#modalLayer{
  position:absolute; inset:0; z-index:20;
  background:rgba(3,4,6,.78); backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center; padding:16px;
}
#modalLayer.hidden{ display:none; }
.modal{
  width:100%; max-width:420px; max-height:82%; display:flex; flex-direction:column;
  background:linear-gradient(180deg,#12151b,#0b0d11);
  border:1px solid var(--line); border-radius:14px; overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.7);
}
.modal.warn{ border-color:color-mix(in srgb, var(--accent2) 55%, transparent); box-shadow:0 0 40px color-mix(in srgb, var(--accent2) 20%, transparent), 0 24px 60px rgba(0,0,0,.7); }
.modal-hd{ padding:12px 14px 8px; border-bottom:1px solid var(--line); }
.modal-hd .mt{ font-size:15px; font-weight:800; letter-spacing:.03em; }
.modal-hd .ms{ font-size:11px; color:var(--accent2); margin-top:3px; font-family:ui-monospace,monospace; }
.modal-bd{ padding:12px 14px; overflow-y:auto; font-size:13px; line-height:1.75; }
.modal-ft{ padding:10px 14px calc(12px + var(--safe-b)); display:flex; gap:8px; border-top:1px solid var(--line); }
.modal-ft .btn{ flex:1; }
.typing{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; white-space:pre-wrap; word-break:break-word; }
.caret{ display:inline-block; width:8px; background:var(--accent2); color:transparent; animation:blink .8s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:0; } }
.logmeta{ font-size:11px; color:var(--dim); margin-bottom:8px; font-family:ui-monospace,monospace; }
.reward{ margin-top:12px; padding:9px 10px; border-radius:9px; background:color-mix(in srgb, var(--accent) 12%, transparent); border:1px dashed color-mix(in srgb, var(--accent) 45%, transparent); font-size:12px; color:var(--accent); }
.scramble{ color:var(--dim2); letter-spacing:.08em; word-break:break-all; font-family:ui-monospace,monospace; font-size:12px; }

/* ---------- Toast ---------- */
#toasts{ position:absolute; left:0; right:0; top:calc(var(--hud-h) + 6px); z-index:15; pointer-events:none; display:flex; flex-direction:column; align-items:center; gap:6px; }
.toast{
  background:rgba(14,17,22,.94); border:1px solid var(--line);
  border-left:3px solid var(--accent);
  padding:8px 12px; border-radius:9px; font-size:12.5px; max-width:88%;
  animation:toastIn .25s ease-out, toastOut .4s ease-in 2.6s forwards;
}
.toast.cyan{ border-left-color:var(--accent2); }
@keyframes toastIn{ from{ opacity:0; transform:translateY(-8px) } to{ opacity:1; transform:none } }
@keyframes toastOut{ to{ opacity:0; transform:translateY(-6px) } }

/* ---------- 启动遮罩 ---------- */
#boot{
  position:absolute; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(80% 60% at 50% 40%, #101319, #05060a 70%);
}
#boot.hidden{ display:none; }
.boot-inner{ text-align:center; padding:20px; }
.boot-title{ font-size:26px; font-weight:800; letter-spacing:.4em; color:var(--accent); text-shadow:0 0 30px rgba(255,166,58,.35); }
.boot-msg{ margin-top:12px; font-size:12px; color:var(--dim); }
.boot-tip{ margin-top:10px; font-size:11px; color:var(--dim2); max-width:300px; line-height:1.6; }
.boot-error .boot-title{ color:var(--bad); }

/* ---------- 镜头晃动 / 画面异常 ---------- */
#app.shake #gl, #app.shake #grain, #app.shake #dark{ animation:shake .42s ease-out; }
@keyframes shake{
  0%,100%{ transform:translate(0,0) }
  20%{ transform:translate(-3px,2px) }
  40%{ transform:translate(3px,-2px) }
  60%{ transform:translate(-2px,-2px) }
  80%{ transform:translate(2px,1px) }
}
#app.glitch #gl{ animation:glitch .5s steps(2) 2; }
@keyframes glitch{
  0%{ filter:none }
  25%{ filter:hue-rotate(35deg) saturate(1.6) contrast(1.2) }
  50%{ filter:invert(.08) saturate(.7) }
  75%{ filter:hue-rotate(-25deg) brightness(1.2) }
  100%{ filter:none }
}

/* ---------- 大屏适配 ---------- */
@media (min-width:720px){
  :root{ --panel-h:52vh; }
  #gl{ height:calc(100% - var(--panel-h)); }
  .tabpane{ padding:12px 16px 28px; }
  .modal{ max-width:520px; }
  #digBtn{ right:24px; width:104px; height:104px; }
}
@media (max-height:620px){
  :root{ --panel-h:44vh; --hud-h:84px; }
  .stat-depth .v{ font-size:26px; }
}
</style>
</head>
<body>

<div id="app">

  <!-- ===== 3D 场景 ===== -->
  <canvas id="gl"></canvas>
  <div id="grain" aria-hidden="true"></div>
  <div id="dark" aria-hidden="true"></div>

  <!-- ===== 顶部 HUD ===== -->
  <header id="hud">
    <div class="hud-main">
      <div class="stat stat-depth">
        <span class="k">深度</span>
        <span class="v" id="hDepth">0.0</span><span class="u">m</span>
      </div>
      <div class="stat">
        <span class="k">金币</span>
        <span class="v amber" id="hCoins">0</span>
      </div>
      <div class="stat">
        <span class="k">矿石</span>
        <span class="v cyan" id="hOre">0</span>
      </div>
    </div>
    <div class="hud-sub">
      <div class="chip chip-layer" id="hLayer">泥土层</div>
      <div class="chip"><span class="k">产出</span><span id="hCps">0</span><span class="k">/s</span></div>
      <div class="chip"><span class="k">岩芯</span><span id="hCores" class="amber">0</span></div>
      <div class="chip"><span class="k">离线</span><span id="hOff">0</span><span class="k">/h</span></div>
      <div class="chip chip-log" id="hNextLog">下一条日志 1000m</div>
    </div>
    <div id="depthBar"><i id="depthBarFill"></i></div>
  </header>

  <!-- ===== 挖掘按钮（悬浮操作） ===== -->
  <button id="digBtn" aria-label="挖掘">
    <span class="dig-core">⛏</span>
    <span class="dig-label">挖掘</span>
    <span class="dig-sub" id="digSub">+1.0m</span>
  </button>

  <!-- ===== 浮动数字层 ===== -->
  <div id="floaters" aria-hidden="true"></div>

  <!-- ===== 底部面板 ===== -->
  <section id="panel">
    <nav id="tabs">
      <button class="tab active" data-tab="drill">钻探</button>
      <button class="tab" data-tab="crew">队伍</button>
      <button class="tab" data-tab="arch">档案</button>

/** 数字格式化：≥1e6 使用 K/M/B/T/aa/ab… 后缀 */
const LETTERS = 'abcdefghijklmnopqrstuvwxyz';
function fmt(n) {
  if (n === null || n === undefined || !isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1e6) {
    const v = Math.floor(n);
    return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  const tier = Math.floor(Math.log10(n) / 3);           // 2 → 1e6
  if (tier > 60) return '∞';
  let suffix;
  if (tier === 2) suffix = 'M';
  else if (tier === 3) suffix = 'B';
  else if (tier === 4) suffix = 'T';
  else {
    const k = tier - 5;                                  // 0 → aa (1e15)
    suffix = LETTERS[k % 26].repeat(Math.floor(k / 26) + 1);
  }
  const m = n / Math.pow(10, tier * 3);
  const s = m < 10 ? m.toFixed(2) : (m < 100 ? m.toFixed(1) : m.toFixed(0));
  return s + suffix;
}
/** 深度专用：浅处保留一位小数 */
function fmtDepth(d) {
  if (d < 1000) return d.toFixed(1);
  return fmt(Math.floor(d));
}
/** 时间格式化：秒 → "2小时13分" */
function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h > 0) return h + ' 小时 ' + m + ' 分';
  if (m > 0) return m + ' 分 ' + s + ' 秒';
  return s + ' 秒';
}
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const rand  = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const $  = id => document.getElementById(id);
const el = (tag, cls, html) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
};
/** 节流：同一时间窗内只执行一次 */
function throttleFn(fn, ms) {
  let last = -1e9;
  return function () {
    const now = performance.now();
    if (now - last < ms) return false;
    last = now;
    fn.apply(null, arguments);
    return true;
  };
}

/* ==========================================================================
 * §4  Sound —— 全部音频由 Web Audio API 程序化合成，无外部音频文件
 *      · 挖掘：低频噪声 burst + 快速衰减包络（带节流）
 *      · 购买：上行两音符方波琶音
 *      · 里程碑：低频轰鸣 + 卷积混响
 *      · 日志：不和谐高频颤音
 *      · BGM  ：失谐 drone + 五声音阶随机音符 + 深度驱动的音高/不协和度
 * ========================================================================== */
const Sound = {
  ctx:null, master:null, sfxBus:null, bgmBus:null, reverb:null,
  noiseBuf:null, ready:false,
  bgmOn:false, bgmTimer:null, drone:[], wind:null, lastDig:-1e9,

  /** 必须在用户首次交互后调用（浏览器自动播放策略） */
  init() {
    if (this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { this.ctx = new AC(); } catch (e) { return false; }
    const ctx = this.ctx;
    this.master = ctx.createGain();
    this.master.gain.value = S.settings.muted ? 0 : 1;
    this.master.connect(ctx.destination);

    this.sfxBus = ctx.createGain();
    this.sfxBus.gain.value = S.settings.sfx;
    this.sfxBus.connect(this.master);

    this.bgmBus = ctx.createGain();
    this.bgmBus.gain.value = S.settings.bgm * 0.75;
    this.bgmBus.connect(this.master);

    // 程序化脉冲响应（混响）
    try {
      this.reverb = ctx.createConvolver();
      this.reverb.buffer = this.makeIR(3.0, 2.6);
      const rg = ctx.createGain(); rg.gain.value = 0.6;
      this.reverb.connect(rg); rg.connect(this.master);
    } catch (e) { this.reverb = null; }

    this.noiseBuf = this.makeNoise(2.0);
    this.ready = true;
    return true;
  },

  makeIR(dur, decay) {
    const ctx = this.ctx, sr = ctx.sampleRate, len = Math.floor(sr * dur);
    const buf = ctx.createBuffer(2, len, sr);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  },
  makeNoise(dur) {
    const ctx = this.ctx, sr = ctx.sampleRate, len = Math.floor(sr * dur);
    const buf = ctx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  },

  _env(node, t, peak, attack, dur) {
    const g = node.gain;
    g.setValueAtTime(0.0001, t);
    g.linearRampToValueAtTime(peak, t + attack);
    g.exponentialRampToValueAtTime(0.0001, t + dur);
  },
  _toReverb(node, amount) {
    if (!this.reverb) return;
    const g = this.ctx.createGain(); g.gain.value = amount;
    node.connect(g); g.connect(this.reverb);
  },

  /** 挖掘音效（节流，避免同一帧多次触发） */
  dig(intensity) {
    if (!this.ready) return;
    const now = performance.now() / 1000;
    if (now - this.lastDig < CONFIG.audio.digThrottle) return;
    this.lastDig = now;
    const ctx = this.ctx, t = ctx.currentTime;
    const amp = 0.5 * clamp(intensity || 1, 0.5, 2.2);

    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf; src.loop = true;
    src.playbackRate.value = rand(0.85, 1.25);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = rand(150, 330); bp.Q.value = 1.1;
    const g = ctx.createGain();
    this._env(g, t, amp, 0.006, 0.17);
    src.connect(bp); bp.connect(g); g.connect(this.sfxBus);
    src.start(t); src.stop(t + 0.2);

    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(rand(120, 155), t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.13);
    const og = ctx.createGain();
    this._env(og, t, amp * 0.75, 0.005, 0.19);
    o.connect(og); og.connect(this.sfxBus);
    o.start(t); o.stop(t + 0.21);
  },

  /** 购买：上行两音符方波琶音 */
  buy() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    [[523.25, 0], [783.99, 0.085]].forEach(function (p) {
      const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = p[0];
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t + p[1]);
      g.gain.linearRampToValueAtTime(0.14, t + p[1] + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + p[1] + 0.14);
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
      o.connect(lp); lp.connect(g); g.connect(Sound.sfxBus);
      o.start(t + p[1]); o.stop(t + p[1] + 0.16);
    });
  },

  /** 里程碑：低频轰鸣 + 长混响 */
  milestone() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.5, t + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
    g.connect(this.sfxBus);
    this._toReverb(g, 0.7);

    const o1 = ctx.createOscillator(); o1.type = 'sine';
    o1.frequency.setValueAtTime(72, t); o1.frequency.exponentialRampToValueAtTime(30, t + 1.9);
    const o2 = ctx.createOscillator(); o2.type = 'triangle';
    o2.frequency.setValueAtTime(108, t); o2.frequency.exponentialRampToValueAtTime(47, t + 1.6);
    o1.connect(g); o2.connect(g);
    o1.start(t); o1.stop(t + 2.3); o2.start(t); o2.stop(t + 2.1);

    const n = ctx.createBufferSource(); n.buffer = this.noiseBuf; n.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(700, t); lp.frequency.exponentialRampToValueAtTime(110, t + 1.6);
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.22, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
    n.connect(lp); lp.connect(ng); ng.connect(this.sfxBus);
    this._toReverb(ng, 0.5);
    n.start(t); n.stop(t + 1.9);
  },

  /** 日志触发：不和谐高频颤音 */
  logTone() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.15, t + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.9);
    g.connect(this.sfxBus);
    this._toReverb(g, 0.65);

    // 颤音 LFO 直接调制增益
    const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 6.8;
    const lfoG = ctx.createGain(); lfoG.gain.value = 0.055;
    lfo.connect(lfoG); lfoG.connect(g.gain);
    lfo.start(t); lfo.stop(t + 2.0);

    [1180, 1249, 1323].forEach(function (f) {   // 半音堆叠 → 不协和
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      o.connect(g); o.start(t); o.stop(t + 2.0);
    });
  },

  /** 界面轻点 */
  ui() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 880;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.06, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    o.connect(g); g.connect(this.sfxBus);
    o.start(t); o.stop(t + 0.08);
  },

  /* ---------------- 特效专属音效 ---------------- */
  /** 电流：锯齿波快速下扫 + 带通（钻头重构 / 钻井阵列） */
  zap() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(1500, t);
    o.frequency.exponentialRampToValueAtTime(200, t + 0.17);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 950; bp.Q.value = 3.2;
    const g = ctx.createGain();
    this._env(g, t, 0.17, 0.005, 0.2);
    o.connect(bp); bp.connect(g); g.connect(this.sfxBus);
    this._toReverb(g, 0.25);
    o.start(t); o.stop(t + 0.22);
  },
  /** 爆炸：低频噪声 + 下扫低通 + 混响（爆破班组 / 深层爆破） */
  boom() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const n = ctx.createBufferSource(); n.buffer = this.noiseBuf; n.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(70, t + 0.6);
    const g = ctx.createGain();
    this._env(g, t, 0.6, 0.008, 0.75);
    n.connect(lp); lp.connect(g); g.connect(this.sfxBus);
    this._toReverb(g, 0.55);
    n.start(t); n.stop(t + 0.8);
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(35, t + 0.5);
    const og = ctx.createGain();
    this._env(og, t, 0.45, 0.006, 0.6);
    o.connect(og); og.connect(this.sfxBus);
    o.start(t); o.stop(t + 0.65);
  },
  /** 清脆三音上行（市场合约 / 成就） */
  chime() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    [523.25, 659.25, 987.77].forEach(function (f, i) {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = ctx.createGain();
      const off = i * 0.07;
      g.gain.setValueAtTime(0.0001, t + off);
      g.gain.linearRampToValueAtTime(0.13, t + off + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.5);
      o.connect(g); g.connect(Sound.sfxBus);
      Sound._toReverb(g, 0.4);
      o.start(t + off); o.stop(t + off + 0.55);
    });
  },
  /** 蒸汽：高通噪声短促（气动钻机 / 地热） */
  steam() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const n = ctx.createBufferSource(); n.buffer = this.noiseBuf; n.loop = true;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1700;
    const g = ctx.createGain();
    this._env(g, t, 0.2, 0.02, 0.42);
    n.connect(hp); hp.connect(g); g.connect(this.sfxBus);
    n.start(t); n.stop(t + 0.45);
  },
  /** 高频铃声 + 长混响（选矿厂 / 共振发生器） */
  shimmer() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    [1568, 2093, 3136].forEach(function (f, i) {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.09 - i * 0.02, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
      o.connect(g); g.connect(Sound.sfxBus);
      Sound._toReverb(g, 0.7);
      o.start(t); o.stop(t + 1.4);
    });
  },

  /* ---------------- BGM：程序化氛围音乐 ---------------- */
  startBGM() {
    if (!this.ready || this.bgmOn) return;
    const ctx = this.ctx, t = ctx.currentTime;
    this.bgmOn = true;
    const base = CONFIG.audio.bgmBaseFreq;
    // 三个略微失谐的正弦 / 三角波：基频 + 微失谐 + 五度
    const specs = [[base, 'sine', 0.42], [base * 1.006, 'sine', 0.20], [base * 1.498, 'triangle', 0.13]];
    this.drone = specs.map(function (sp) {
      const o = ctx.createOscillator(); o.type = sp[1]; o.frequency.value = sp[0];
      const g = ctx.createGain(); g.gain.value = 0.0001;
      g.gain.linearRampToValueAtTime(sp[2], t + 3.0);
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
      o.connect(g); g.connect(lp); lp.connect(Sound.bgmBus);
      o.start(t);
      return { osc:o, gain:g, lp:lp, mult:sp[0] / base };
    });
    // 风声层
    const n = ctx.createBufferSource(); n.buffer = this.noiseBuf; n.loop = true;
    const nf = ctx.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 240;
    const ng = ctx.createGain(); ng.gain.value = 0.0001;
    ng.gain.linearRampToValueAtTime(0.07, t + 4.0);
    n.connect(nf); nf.connect(ng); ng.connect(this.bgmBus);
    n.start(t);
    this.wind = { src:n, gain:ng };

    this.updateBGM(S.depth);
    this._scheduleNote();
  },

  stopBGM() {
    if (!this.bgmOn) return;
    this.bgmOn = false;
    if (this.bgmTimer) { clearTimeout(this.bgmTimer); this.bgmTimer = null; }
    const t = this.ctx.currentTime;
    this.drone.forEach(function (d) {
      d.gain.gain.cancelScheduledValues(t);
      d.gain.gain.setValueAtTime(d.gain.gain.value, t);
      d.gain.gain.linearRampToValueAtTime(0.0001, t + 0.6);
      try { d.osc.stop(t + 0.7); } catch (e) {}
    });
    this.drone = [];
    if (this.wind) {
      this.wind.gain.gain.cancelScheduledValues(t);
      this.wind.gain.gain.setValueAtTime(this.wind.gain.gain.value, t);
      this.wind.gain.gain.linearRampToValueAtTime(0.0001, t + 0.6);
      try { this.wind.src.stop(t + 0.7); } catch (e) {}
      this.wind = null;
    }
  },

  _scheduleNote() {
    const self = this;
    const gap = rand(CONFIG.audio.bgmNoteGap[0], CONFIG.audio.bgmNoteGap[1]);
    this.bgmTimer = setTimeout(function () {
      if (!self.bgmOn) return;
      self.playNote();
      self._scheduleNote();
    }, gap * 1000);
  },

  /** 五声音阶随机音符；深度越大音高越低、不协和音越多 */
  playNote() {
    if (!this.ready) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const deep = clamp(S.depth / 12000, 0, 1);
    const base = 220 * Math.pow(0.5, deep * 1.35);          // 深度 → 音高下降
    const scale = [0, 3, 5, 7, 10];                          // 小调五声音阶
    const semis = scale[randInt(0, scale.length - 1)] + (Math.random() < 0.35 ? 12 : 0);
    const f = base * Math.pow(2, semis / 12);

    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
    o.connect(g); g.connect(this.bgmBus);
    this._toReverb(g, 0.45);
    o.start(t); o.stop(t + 1.9);

    // 4000m 以下随机叠加不协和半音
    if (S.depth > 4000 && Math.random() < 0.15 + deep * 0.35) {
      const o2 = ctx.createOscillator(); o2.type = 'triangle';
      o2.frequency.value = f * 1.0595;
      const g2 = ctx.createGain();
      g2.gain.setValueAtTime(0.0001, t);
      g2.gain.linearRampToValueAtTime(0.07, t + 0.05);
      g2.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
      o2.connect(g2); g2.connect(this.bgmBus);
      this._toReverb(g2, 0.4);
      o2.start(t); o2.stop(t + 1.5);
    }
  },

  /** 随深度推进 drone 音高与音色（每 2 秒调用一次即可） */
  updateBGM(depth) {
    if (!this.bgmOn || !this.ready) return;
    const deep = clamp(depth / 12000, 0, 1);
    const f = CONFIG.audio.bgmBaseFreq * Math.pow(0.52, deep);
    const t = this.ctx.currentTime;
    this.drone.forEach(function (d) {
      d.osc.frequency.setTargetAtTime(f * d.mult, t, 1.2);
    });
    if (this.wind) this.wind.gain.gain.setTargetAtTime(0.05 + deep * 0.07, t, 2.0);
  },

  /* ---------------- 音量 / 静音 / 挂起 ---------------- */
  setVolumes() {
    if (!this.ready) return;
    this.sfxBus.gain.setTargetAtTime(S.settings.sfx, this.ctx.currentTime, 0.05);
    this.bgmBus.gain.setTargetAtTime(S.settings.bgm * 0.75, this.ctx.currentTime, 0.05);
    this.master.gain.setTargetAtTime(S.settings.muted ? 0 : 1, this.ctx.currentTime, 0.05);
  },
  suspend() { if (this.ctx && this.ctx.state === 'running') { try { this.ctx.suspend(); } catch (e) {} } },
  resume()  { if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} } }
};

/* ==========================================================================
 * §5  存档系统（localStorage + base64 导入导出）
 * ========================================================================== */
function defaultState() {
  return {
    depth:0, maxDepth:0, coins:0, ore:0, totalCoins:0, totalOre:0,
    b:{}, u:{},                     // 建筑数量 / 升级等级
    cores:0, prestige:0, prodMult:1, // 岩芯 / 转生次数 / 日志奖励的永久产能倍率
    logs:[], ach:{},                // 已解锁日志 id / 成就
    autosell:false,
    layerIdx:0,
    balanceVersion: CONFIG.balanceVersion,
    stats:{ clicks:0, playTime:0, lastSave:Date.now(), born:Date.now() },
    settings:{ sfx:CONFIG.audio.sfxVolume, bgm:CONFIG.audio.bgmVolume, muted:CONFIG.audio.muted, quality:'mid', fx:true, audioVersion:CONFIG.audio.audioVersion }
  };
}
let S = defaultState();

function num(v, d) { return (typeof v === 'number' && isFinite(v)) ? v : d; }

function applySave(d) {
  if (!d || typeof d !== 'object') return false;
  const base = defaultState();
  S = base;
  ['depth','maxDepth','coins','ore','totalCoins','totalOre','cores','prestige','prodMult']
    .forEach(function (k) { S[k] = num(d[k], base[k]); });
  S.autosell   = !!d.autosell;
  S.layerIdx   = num(d.layerIdx, 0) | 0;
  S.b          = Object.assign({}, d.b || {});
  S.u          = Object.assign({}, d.u || {});
  S.ach        = Object.assign({}, d.ach || {});
  S.stats      = Object.assign(base.stats, d.stats || {});
  S.settings   = Object.assign(base.settings, d.settings || {});
  S.logs       = Array.isArray(d.logs) ? d.logs.filter(function (x) { return typeof x === 'string'; }) : [];
  if (S.prodMult < 1) S.prodMult = 1;
  if (S.depth < 0) S.depth = 0;
  if (S.maxDepth < S.depth) S.maxDepth = S.depth;

  // 音量默认值版本不一致：把音量迁移到新的默认值（不影响其他设置）
  // 注意 audioVersion 存在 settings 里，必须读 d.settings.audioVersion
  if (num((d.settings && d.settings.audioVersion), 1) !== CONFIG.audio.audioVersion) {
    S.settings.sfx = CONFIG.audio.sfxVolume;
    S.settings.bgm = CONFIG.audio.bgmVolume;
  }
  S.settings.audioVersion = CONFIG.audio.audioVersion;

  // 数值版本不一致：保留收藏类进度，重置经济部分
  if (num(d.balanceVersion, 1) !== CONFIG.balanceVersion) {
    const keep = {
      logs: S.logs, ach: S.ach, prestige: S.prestige, cores: S.cores,
      prodMult: S.prodMult, settings: S.settings, stats: S.stats
    };
    S = defaultState();
    S.logs = keep.logs; S.ach = keep.ach; S.prestige = keep.prestige; S.cores = keep.cores;
    S.prodMult = keep.prodMult; S.settings = keep.settings; S.stats = keep.stats;
    S.migrated = true;
  }
  return true;
}

function loadGame() {
  try {
    const raw = localStorage.getItem(CONFIG.saveKey);
    if (!raw) return false;
    return applySave(JSON.parse(raw));
  } catch (e) { console.warn('[ABYSS] 存档读取失败：', e); return false; }
}
function saveGame() {
  try {
    S.stats.lastSave = Date.now();
    localStorage.setItem(CONFIG.saveKey, JSON.stringify(S));
    return true;
  } catch (e) { console.warn('[ABYSS] 存档写入失败：', e); return false; }
}
function exportSave() {
  try {
    const json = JSON.stringify(S);
    return btoa(unescape(encodeURIComponent(json)));
  } catch (e) { return ''; }
}
function importSave(text) {
  try {
    const json = decodeURIComponent(escape(atob(String(text).trim())));
    const ok = applySave(JSON.parse(json));
    if (ok) { recalc(); refreshAllUI(); saveGame(); }
    return ok;
  } catch (e) { return false; }
}
function hardReset() {
  S = defaultState();
  try { localStorage.removeItem(CONFIG.saveKey); } catch (e) {}
  recalc(); refreshAllUI();
}

/* 自动保存 */
let autosaveTimer = 0;
function tickAutosave(dt) {
  autosaveTimer += dt;
  if (autosaveTimer >= CONFIG.autosaveInterval) { autosaveTimer = 0; saveGame(); }
}

/* ==========================================================================
 * §6  经济系统
 * ========================================================================== */

/** 派生数值缓存（每帧重算，避免在 UI 中重复计算） */
const D = {
  layerIdx:0, layer:LAYERS[0], res:1,
  rawDps:0, speedMult:1, oreMult:1, priceMult:1,
  dps:0, ops:0, cps:0, unitPrice:1,
  clickPow:1, clickDepth:1
};

function layerIndex(depth) {
  let idx = 0;
  for (let i = 0; i < LAYERS.length; i++) if (depth >= LAYERS[i].from) idx = i;
  return idx;
}
/** 深度推进阻力（节奏墙） */
function resistance(depth) { return Math.pow(CONFIG.depth.resistanceBase, depth); }

function recalc() {
  const li = layerIndex(S.depth);
  const lay = LAYERS[li];
  D.layerIdx = li;
  D.layer    = lay;
  D.res      = resistance(S.depth);

  let dpsAdd = 0, oreAdd = 0, priceAdd = 0, raw = 0;
  for (let i = 0; i < BUILDINGS.length; i++) {
    const b = BUILDINGS[i], n = S.b[b.id] || 0;
    if (!n) continue;
    if (b.dpsAdd)   dpsAdd   += b.dpsAdd * n;
    if (b.oreAdd)   oreAdd   += b.oreAdd * n;
    if (b.priceAdd) priceAdd += b.priceAdd * n;
    if (b.dps)      raw      += b.dps * n;
  }
  for (let i = 0; i < UPGRADES.length; i++) {
    const u = UPGRADES[i], n = S.u[u.id] || 0;
    if (!n) continue;
    if (u.kind === 'oreAdd')        oreAdd   += u.per * n;
    else if (u.kind === 'priceAdd') priceAdd += u.per * n;
    else if (u.kind === 'speedAdd') dpsAdd   += u.per * n;
  }

  const coreSpeed = 1 + CONFIG.prestige.speedPerCore * S.cores;
  const corePrice = 1 + CONFIG.prestige.pricePerCore * S.cores;

  D.speedMult = (1 + dpsAdd) * coreSpeed * S.prodMult;   // 挖掘速度倍率
  D.oreMult   = (1 + oreAdd) * lay.oreCoeff;             // 每米矿石倍率
  D.priceMult = (1 + priceAdd) * corePrice * S.prodMult; // 矿石售价倍率
  D.rawDps    = raw;
  D.dps       = raw * D.speedMult / D.res;               // 有效 米/秒
  D.ops       = D.dps * CONFIG.click.orePerMeter * D.oreMult;
  D.unitPrice = lay.price * (1 + S.depth / CONFIG.depth.priceDepthScale) * D.priceMult * CONFIG.sellRatio;
  D.cps       = D.ops * D.unitPrice;                     // 自动出售时的 金币/秒

  const lv = S.u.drill || 0;
  D.clickPow   = CONFIG.click.baseDepth * Math.pow(1.6, lv) * D.speedMult * lay.clickCoeff;
  D.clickDepth = D.clickPow / D.res;
}

/* ---------------- 成本与购买 ---------------- */
/** 建筑：一次购买 n 个的总价（等比级数求和） */
function buildingCost(b, n) {
  const own = S.b[b.id] || 0, r = CONFIG.costGrowth;
  return b.baseCost * Math.pow(r, own) * (Math.pow(r, n) - 1) / (r - 1);
}
function buildingMax(b) {
  const own = S.b[b.id] || 0, r = CONFIG.costGrowth;
  const c0 = b.baseCost * Math.pow(r, own);
  if (S.coins < c0) return 0;
  const n = Math.floor(Math.log(S.coins * (r - 1) / c0 + 1) / Math.log(r));
  return clamp(isFinite(n) ? n : 0, 0, 1000);
}
function upgradeCost(u, n) {
  const lv = S.u[u.id] || 0, r = u.costMul;
  return u.baseCost * Math.pow(r, lv) * (Math.pow(r, n) - 1) / (r - 1);
}
function upgradeMax(u) {
  const lv = S.u[u.id] || 0, r = u.costMul;
  const c0 = u.baseCost * Math.pow(r, lv);
  if (S.coins < c0) return 0;
  const n = Math.floor(Math.log(S.coins * (r - 1) / c0 + 1) / Math.log(r));
  return clamp(isFinite(n) ? n : 0, 0, 1000);
}

function buyBuilding(b, n) {
  if (!isUnlockedBuilding(b)) return false;
  if (n === 'max') n = buildingMax(b);
  n = n | 0;
  if (n <= 0) return false;
  const cost = buildingCost(b, n);
  if (S.coins < cost) return false;
  S.coins -= cost;
  S.b[b.id] = (S.b[b.id] || 0) + n;
  recalc();
  FX.play(b.id, S.b[b.id]);          // 每种建筑一套专属特效 + 音效
  return true;
}
function buyUpgrade(u, n) {
  if (n === 'max') n = upgradeMax(u);
  n = n | 0;
  if (n <= 0) return false;
  const cost = upgradeCost(u, n);
  if (S.coins < cost) return false;
  S.coins -= cost;
  S.u[u.id] = (S.u[u.id] || 0) + n;
  recalc();
  FX.play(u.id, S.u[u.id]);          // 每种升级一套专属特效 + 音效
  return true;
}
function isUnlockedBuilding(b) {
  if (S.maxDepth < b.unlock) return false;
  if (b.needPrestige && S.prestige < b.needPrestige) return false;
  return true;
}

/* ---------------- 推进 ---------------- */
function advance(depthGain) {
  if (!isFinite(depthGain) || depthGain <= 0) return 0;
  S.depth += depthGain;
  if (S.depth > S.maxDepth) S.maxDepth = S.depth;
  const ore = depthGain * CONFIG.click.orePerMeter * D.oreMult;
  S.totalOre += ore;
  if (S.autosell) {
    const c = ore * D.unitPrice;
    S.coins += c; S.totalCoins += c;
  } else {
    S.ore += ore;
  }
  return depthGain;
}

let autoEmitTimer = 0;
function tick(dt) {
  recalc();
  if (D.dps > 0) {
    advance(D.dps * dt);
    autoEmitTimer += dt;
    if (autoEmitTimer > 0.14) {
      autoEmitTimer = 0;
      const n = clamp(Math.round(D.dps * 0.06), 1, 6);
      Scene.emitDebris(n, 0.7);
    }
  }
  checkLayer();
  checkLogs();
  S.stats.playTime += dt;
}

/* ---------------- 挖掘（点击） ---------------- */
function dig(x, y) {
  recalc();
  let gain = D.clickDepth;
  let crit = false;
  if (Math.random() < CONFIG.click.critChance) { crit = true; gain *= CONFIG.click.critMult; }
  advance(gain);
  S.stats.clicks++;

  Sound.dig(crit ? 1.8 : 1);
  Scene.punchDrill(crit ? 2.2 : 1);
  Scene.emitDebris(crit ? 22 : 10, crit ? 1.6 : 1);

  floater((crit ? '暴击 +' : '+') + fmtDepth(gain) + 'm', x, y, crit ? 'crit' : '');
  if (!S.autosell && Math.random() < 0.5) {
    floater('+' + fmt(gain * D.oreMult) + ' 矿石', x, y, 'ore');
  }
  checkLayer();
  checkLogs();
  checkAchievements();
}

function sellOre() {
  if (S.ore <= 0) return 0;
  const c = S.ore * D.unitPrice;
  S.coins += c; S.totalCoins += c;
  S.ore = 0;
  Sound.buy();
  return c;
}

/* ---------------- 矿层里程碑 ---------------- */
function checkLayer() {
  const li = layerIndex(S.depth);
  if (li !== S.layerIdx) {
    const prev = S.layerIdx;
    S.layerIdx = li;
    const lay = LAYERS[li];
    Scene.onLayerChange(li, li > prev);
    Sound.milestone();
    FX.play('layer');
    shakeScreen(li > prev ? 1 : 0.5);
    applyTheme(li);
    toast('进入「' + lay.name + '」　矿石单价 ×' + fmt(lay.price), 'cyan');
    floater('新矿层：' + lay.name, window.innerWidth / 2, window.innerHeight * 0.22, '');
  }
}

/* ---------------- 日志触发 ---------------- */
const logQueue = [];
function hasLog(id) { return S.logs.indexOf(id) >= 0; }
function checkLogs() {
  for (let i = 0; i < LOGS.length; i++) {
    const L = LOGS[i];
    if (S.depth >= L.depth && !hasLog(L.id)) {
      S.logs.push(L.id);
      grantReward(L);
      logQueue.push(L);
    }
  }
  if (logQueue.length && !UI.modalOpen) showLogModal(logQueue.shift());
}
function grantReward(L) {
  if (L.reward === 'coins') {
    // 金币爆发 = 当前秒产出 × rewardCoinSeconds（下限 300）。
    // 注意：不要用「深度 × 单价」之类随深度线性/阶跃增长的保底项，
    // 否则后期单次奖励会远大于玩家总资产，引发连锁爆发、瞬间穿越多个矿层。
    const amt = Math.max(D.cps * CONFIG.narrative.rewardCoinSeconds, 300);
    S.coins += amt; S.totalCoins += amt;
    toast('档案奖励：金币 +' + fmt(amt));
  } else {
    S.prodMult *= (1 + CONFIG.narrative.rewardProdPct);
    toast('档案奖励：永久产能 +5%（累计 ×' + S.prodMult.toFixed(2) + '）', 'cyan');
  }
}
/** 下一条未解锁日志（用于 HUD 常驻目标） */
function nextLogInfo() {
  for (let i = 0; i < LOGS.length; i++) {
    if (!hasLog(LOGS[i].id)) return { log: LOGS[i], remain: Math.max(0, LOGS[i].depth - S.depth) };
  }
  return null;
}

/* ---------------- 成就 ---------------- */
function checkAchievements() {
  for (let i = 0; i < ACHIEVEMENTS.length; i++) {
    const a = ACHIEVEMENTS[i];
    if (!S.ach[a.id] && a.test(S)) {
      S.ach[a.id] = 1;
      toast('成就达成 · ' + a.name, 'cyan');
      Sound.buy();
    }
  }
}

/* ---------------- 转生（岩芯提取） ---------------- */
function coresGain() { return Math.floor(Math.sqrt(S.maxDepth / CONFIG.prestige.corePerDepth)); }
function canPrestige() { return S.maxDepth >= CONFIG.prestige.minDepth && coresGain() > 0; }
function doPrestige() {
  if (!canPrestige()) return false;
  const gain = coresGain();
  const keep = {
    cores: S.cores + gain,
    prestige: S.prestige + 1,
    prodMult: S.prodMult,
    logs: S.logs.slice(),
    ach: Object.assign({}, S.ach),
    stats: Object.assign({}, S.stats),
    settings: Object.assign({}, S.settings)
  };
  S = defaultState();
  S.cores = keep.cores; S.prestige = keep.prestige; S.prodMult = keep.prodMult;
  S.logs = keep.logs; S.ach = keep.ach; S.stats = keep.stats; S.settings = keep.settings;
  S.stats.lastSave = Date.now();
  recalc();
  applyTheme(D.layerIdx);
  Scene.hardResetVisual();
  refreshAllUI();
  saveGame();
  Sound.milestone();
  shakeScreen(1.4);
  return gain;
}

/* ---------------- 离线收益 ----------------
 * 用当前派生数值做分段模拟（深度推进会改变阻力与矿层，逐段逼近更真实）
 * 上限 CONFIG.offlineCapHours 小时
 * ------------------------------------------------------------------ */
function settleOffline(seconds) {
  const sec = Math.min(Math.max(0, seconds), CONFIG.offlineCapHours * 3600);
  if (sec < 1 || D.rawDps <= 0) return null;
  const steps = CONFIG.offlineSteps;
  const dt = sec / steps;
  let d = S.depth, depthG = 0, oreG = 0, coinG = 0;
  for (let i = 0; i < steps; i++) {
    const g = D.rawDps * D.speedMult / resistance(d) * dt;
    if (!isFinite(g) || g <= 0) break;
    d += g; depthG += g;
    const ore = g * CONFIG.click.orePerMeter * D.oreMult;
    if (S.autosell) coinG += ore * LAYERS[layerIndex(d)].price * D.priceMult * CONFIG.sellRatio;
    else oreG += ore;
  }
  if (depthG <= 0) return null;
  S.depth += depthG;
  if (S.depth > S.maxDepth) S.maxDepth = S.depth;
  S.totalOre += oreG;
  if (S.autosell) { S.coins += coinG; S.totalCoins += coinG; }
  else S.ore += oreG;
  recalc();
  return { seconds: sec, capped: seconds > CONFIG.offlineCapHours * 3600, depth: depthG, ore: oreG, coins: coinG };
}

/* ==========================================================================
 * §7  SceneWorld —— Three.js 垂直矿井场景
 *      井壁（BackSide 圆柱 + 程序化岩层贴图） / 钻头 / 矿脉 Points /
 *      碎石粒子对象池 / 雾 / 镜头晃动 / 深度主题
 * ========================================================================== */
const Scene = {
  ok:false, canvas:null, renderer:null, scene:null, camera:null,
  shaft:null, shaftMat:null, shaftTex:null, glowTex:null,
  drill:null, drillGlow:null, spin:0, punch:0,
  veins:null, veinGeo:null, veinPos:null, veinCol:null, veinPhase:[], veinBase:[],
  deb:null, debGeo:null, debPos:null, debCol:null, debVel:null, debLife:null, debLife0:null, debBase:null,
  debMax:0, debCursor:0, debDirty:false,
  amb:null, dirTop:null, dirDeep:null,
  camY:0, shake:0, time:0,
  tintTarget:null, fogTarget:null, layerIdx:-1,
  _c1:null, _c2:null, _tmp:null,

  init(canvas) {
    this.canvas = canvas;
    try {
      this.renderer = new THREE.WebGLRenderer({
        canvas: canvas, antialias: false, alpha: false, powerPreference: 'high-performance'
      });
    } catch (e) {
      console.warn('[ABYSS] WebGL 初始化失败：', e);
      this.ok = false;
      return false;
    }
    const cap = S.settings.quality === 'low' ? 1.25 : (S.settings.quality === 'high' ? 2 : 1.6);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, cap));
    this.renderer.setClearColor(0x05060a, 1);
    if ('outputColorSpace' in this.renderer && THREE.SRGBColorSpace) {
      this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    }

    this.scene = new THREE.Scene();
    this.scene.fog = new THREE.FogExp2(0x0a0806, CONFIG.fx.fogBase);

    this.camera = new THREE.PerspectiveCamera(64, 1, 0.1, 400);
    this.scene.add(this.camera);

    this._c1 = new THREE.Color(); this._c2 = new THREE.Color(); this._tmp = new THREE.Color();
    this.tintTarget = new THREE.Color(LAYERS[0].color);
    this.fogTarget  = new THREE.Color(LAYERS[0].fog);

    /* ---- 灯光：只用环境光 / 平行光，避免不同 three 版本点光源强度差异 ---- */
    this.amb = new THREE.AmbientLight(0x36414d, 1.0);
    this.scene.add(this.amb);
    this.dirTop = new THREE.DirectionalLight(0xffd7a8, 1.25);
    this.dirTop.position.set(0, 40, 8);
    this.scene.add(this.dirTop);
    this.dirDeep = new THREE.DirectionalLight(0x2ad0c8, 0.30);
    this.dirDeep.position.set(0, -40, 0);
    this.scene.add(this.dirDeep);

    /* ---- 程序化贴图 ---- */
    this.glowTex  = makeGlowTexture();
    this.shaftTex = makeRockTexture();
    this.shaftTex.repeat.set(3, CONFIG.fx.textureRepeatY);

    /* ---- 井壁 ---- */
    const H = CONFIG.fx.shaftHeight, R = CONFIG.fx.shaftRadius;
    const shaftGeo = new THREE.CylinderGeometry(R, R, H, 44, 1, true);
    this.shaftMat = new THREE.MeshLambertMaterial({
      map: this.shaftTex, side: THREE.BackSide, color: new THREE.Color(LAYERS[0].color)
    });
    this.shaft = new THREE.Mesh(shaftGeo, this.shaftMat);
    this.scene.add(this.shaft);

    /* ---- 钻头 ---- */
    this.drill = buildDrill();
    this.scene.add(this.drill);
    this.drillGlow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: this.glowTex, color: 0xffa63a, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.75
    }));
    this.drillGlow.scale.set(8, 8, 1);
    this.scene.add(this.drillGlow);

    /* ---- 矿脉点 ---- */
    this.initVeins();
    /* ---- 碎石粒子池 ---- */
    this.setQuality(S.settings.quality || 'mid');

    this.camY = this.targetCamY();
    this.resize();
    this.ok = true;
    return true;
  },

  /* ---------------- 矿脉（井壁发光点，按深度着色，随镜头循环复用） ---------------- */
  initVeins() {
    const N = CONFIG.fx.veinCount;
    const H = CONFIG.fx.shaftHeight;
    const R = CONFIG.fx.shaftRadius * 0.94;
    const pos = new Float32Array(N * 3);
    const col = new Float32Array(N * 3);
    this.veinPhase  = new Float32Array(N);
    this.veinBright = new Float32Array(N);
    this.veinBase   = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = R * rand(0.82, 1.0);
      pos[i * 3]     = Math.cos(a) * r;
      pos[i * 3 + 1] = rand(-H / 2, H / 2);
      pos[i * 3 + 2] = Math.sin(a) * r;
      this.veinPhase[i]  = Math.random() * Math.PI * 2;
      this.veinBright[i] = rand(0.7, 1.3);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const mat = new THREE.PointsMaterial({
      size: 0.55, map: this.glowTex, vertexColors: true, transparent: true,
      depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true, opacity: 0.95
    });
    this.veins = new THREE.Points(geo, mat);
    this.veins.frustumCulled = false;
    this.veinGeo = geo; this.veinPos = pos; this.veinCol = col;
    this.scene.add(this.veins);
    this.refreshVeinColors(true);
  },

  /** 按每个点的绝对深度重新着色 */
  refreshVeinColors(force) {
    if (!this.veins) return;
    const N = CONFIG.fx.veinCount, H = CONFIG.fx.shaftHeight;
    const camY = this.camY, W = CONFIG.depth.worldPerMeter;
    const pos = this.veinPos, col = this.veinCol, base = this.veinBase;
    let dirty = false;
    for (let i = 0; i < N; i++) {
      const y = pos[i * 3 + 1];
      // 循环复用：越过可视段就搬到另一端
      let yy = y;
      if (yy > camY + H / 2) { yy -= H; dirty = true; }
      else if (yy < camY - H / 2) { yy += H; dirty = true; }
      if (dirty) pos[i * 3 + 1] = yy;
      if (!force && !dirty && !this.deep) continue;
      const depthM = Math.max(0, -yy / W);
      const li = layerIndex(depthM);
      this._tmp.setHex(LAYERS[li].color);
      // 深部：闪烁频率异常（压迫感）
      let k = this.veinBright[i];
      if (this.deep > 0) {
        const f = 2 + this.deep * 9;
        k *= 0.45 + 0.55 * Math.abs(Math.sin(this.time * f + this.veinPhase[i]));
      }
      const r = this._tmp.r * k, g = this._tmp.g * k, b = this._tmp.b * k;
      col[i * 3] = r; col[i * 3 + 1] = g; col[i * 3 + 2] = b;
      base[i * 3] = r; base[i * 3 + 1] = g; base[i * 3 + 2] = b;
    }
    if (dirty) this.veinGeo.attributes.position.needsUpdate = true;
    this.veinGeo.attributes.color.needsUpdate = true;
  },

  /* ---------------- 碎石粒子池 ---------------- */
  setQuality(level) {
    let max = CONFIG.fx.quality[level] || CONFIG.fx.quality.mid;
    max = Math.min(max, CONFIG.fx.maxParticles);
    if (this.deb) { this.scene.remove(this.deb); this.debGeo.dispose(); this.deb.material.dispose(); }
    const pos = new Float32Array(max * 3);
    const col = new Float32Array(max * 3);
    for (let i = 0; i < max; i++) { pos[i * 3 + 1] = 1e6; }   // 死亡粒子停放在远方
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const mat = new THREE.PointsMaterial({
      size: 0.42, map: this.glowTex, vertexColors: true, transparent: true,
      depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
    });
    const pts = new THREE.Points(geo, mat);
    pts.frustumCulled = false;
    this.deb = pts; this.debGeo = geo; this.debPos = pos; this.debCol = col;
    this.debVel   = new Float32Array(max * 3);
    this.debLife  = new Float32Array(max);
    this.debLife0 = new Float32Array(max);
    this.debBase  = new Float32Array(max * 3);
    this.debGrav  = new Float32Array(max);
    this.debDrag  = new Float32Array(max);
    this.debMode  = new Uint8Array(max);
    this.debMax = max; this.debCursor = 0;
    this.scene.add(pts);
  },

  /** 挖掘碎石（兼容旧调用） */
  emitDebris(n, power) {
    this.emit('burst', n, (D.layer ? D.layer.color : LAYERS[0].color), power || 1);
  },

  /**
   * 通用粒子发射。不同特效用不同 mode 区分运动形态：
   *   burst  径向喷射 + 重力（碎石）
   *   jet    向上喷射、负重力（蒸汽 / 等离子 / 地热）
   *   spiral 螺旋上升（钻头重构 / 共振）
   *   rain   从上方落下（金币雨）
   *   spark  高速短命火花（声呐 / 电流）
   */
  emit(mode, n, colorHex, power) {
    if (!this.ok || !this.deb) return;
    const p = power || 1;
    const y0 = this.drillY() - 1.2;
    this._tmp.setHex((colorHex === undefined || colorHex === null)
      ? (D.layer ? D.layer.color : LAYERS[0].color) : colorHex);
    const cnt = Math.min(Math.round(n) || 0, this.debMax);
    for (let k = 0; k < cnt; k++) {
      const i = this.debCursor;
      this.debCursor = (this.debCursor + 1) % this.debMax;      // 超出上限后复用最老的
      const a = Math.random() * Math.PI * 2;
      const r = rand(0.3, 1.6);
      const i3 = i * 3;
      let px, py, pz, vx, vy, vz, grav = 15.5, drag = 1.15, life = rand(0.55, 1.35);

      if (mode === 'jet') {
        px = Math.cos(a) * r * 0.7; pz = Math.sin(a) * r * 0.7; py = y0 - rand(0, 1.0);
        vx = Math.cos(a) * rand(0.5, 2.0) * p; vy = rand(5, 12) * p; vz = Math.sin(a) * rand(0.5, 2.0) * p;
        grav = -2.2; drag = 0.55; life = rand(0.7, 1.5);
      } else if (mode === 'spiral') {
        px = Math.cos(a) * r; pz = Math.sin(a) * r; py = y0 - rand(0, 1.4);
        vx = Math.cos(a) * rand(1.2, 3.0) * p - Math.sin(a) * 3.4;
        vy = rand(3.5, 8) * p;
        vz = Math.sin(a) * rand(1.2, 3.0) * p + Math.cos(a) * 3.4;
        grav = -1.2; drag = 0.5; life = rand(0.9, 1.7);
      } else if (mode === 'rain') {
        px = rand(-3.6, 3.6); pz = rand(-3.6, 3.6); py = this.camY + rand(8, 20);
        vx = rand(-0.6, 0.6); vy = -rand(3, 7) * p; vz = rand(-0.6, 0.6);
        grav = 7.5; drag = 0.25; life = rand(0.9, 1.7);
      } else if (mode === 'spark') {
        px = Math.cos(a) * r * 0.8; pz = Math.sin(a) * r * 0.8; py = y0 - rand(0, 1.6);
        vx = Math.cos(a) * rand(3, 9) * p; vy = rand(2, 8) * p; vz = Math.sin(a) * rand(3, 9) * p;
        grav = 13; drag = 1.9; life = rand(0.25, 0.6);
      } else { // burst
        px = Math.cos(a) * r; pz = Math.sin(a) * r; py = y0 - rand(0, 1.4);
        vx = Math.cos(a) * rand(1.2, 5.2) * p; vy = rand(1.5, 7.5) * p; vz = Math.sin(a) * rand(1.2, 5.2) * p;
        grav = 15.5; drag = 1.15; life = rand(0.55, 1.35);
      }

      this.debPos[i3] = px; this.debPos[i3 + 1] = py; this.debPos[i3 + 2] = pz;
      this.debVel[i3] = vx; this.debVel[i3 + 1] = vy; this.debVel[i3 + 2] = vz;
      this.debLife[i] = life; this.debLife0[i] = life;
      this.debGrav[i] = grav; this.debDrag[i] = drag;

      // 颜色：矿层色 / 指定色 + 琥珀火花
      const spark = (mode === 'spark') || Math.random() < 0.45;
      const cr = spark ? 1.0 : this._tmp.r * rand(0.8, 1.3);
      const cg = spark ? rand(0.55, 0.78) : this._tmp.g * rand(0.8, 1.3);
      const cb = spark ? rand(0.15, 0.35) : this._tmp.b * rand(0.8, 1.3);
      this.debBase[i3] = cr; this.debBase[i3 + 1] = cg; this.debBase[i3 + 2] = cb;
      this.debCol[i3] = cr; this.debCol[i3 + 1] = cg; this.debCol[i3 + 2] = cb;
    }
    this.debDirty = true;
  },

  updateDebris(dt) {
    if (!this.deb) return;
    const pos = this.debPos, col = this.debCol, vel = this.debVel;
    const life = this.debLife, life0 = this.debLife0, base = this.debBase;
    const grav = this.debGrav, dragArr = this.debDrag;
    let any = false;
    for (let i = 0; i < this.debMax; i++) {
      if (life[i] <= 0) continue;
      any = true;
      life[i] -= dt;
      const i3 = i * 3;
      if (life[i] <= 0) {                       // 回收：置黑（加法混合下不可见）+ 停放远处
        col[i3] = 0; col[i3 + 1] = 0; col[i3 + 2] = 0;
        pos[i3 + 1] = 1e6;
        continue;
      }
      pos[i3]     += vel[i3] * dt;
      pos[i3 + 1] += vel[i3 + 1] * dt;
      pos[i3 + 2] += vel[i3 + 2] * dt;
      vel[i3 + 1] -= grav[i] * dt;              // 每种特效可有不同重力（负 = 上浮）
      const drag = Math.max(0, 1 - dragArr[i] * dt);
      vel[i3] *= drag; vel[i3 + 1] *= drag; vel[i3 + 2] *= drag;
      const k = life[i] / life0[i];             // 生命衰减 → 亮度衰减
      col[i3] = base[i3] * k; col[i3 + 1] = base[i3 + 1] * k; col[i3 + 2] = base[i3 + 2] * k;
    }
    if (any || this.debDirty) {
      this.debGeo.attributes.position.needsUpdate = true;
      this.debGeo.attributes.color.needsUpdate = true;
      this.debDirty = false;
    }
  },

  /* ---------------- 位置与镜头 ---------------- */
  targetCamY() { return -S.depth * CONFIG.depth.worldPerMeter; },
  drillY() { return this.camY - 6.2; },

  punchDrill(power) { this.punch = Math.min(3.2, this.punch + (power || 1)); },

  onLayerChange(idx) {
    this.layerIdx = idx;
    this.tintTarget = new THREE.Color(LAYERS[idx].color);
    this.fogTarget  = new THREE.Color(LAYERS[idx].fog);
    this.shake = Math.max(this.shake, 0.85);
  },

  hardResetVisual() {
    this.camY = this.targetCamY();
    this.shake = 0; this.punch = 0;
    if (this.deb) {
      for (let i = 0; i < this.debMax; i++) {
        this.debLife[i] = 0;
        this.debPos[i * 3 + 1] = 1e6;
        this.debCol[i * 3] = this.debCol[i * 3 + 1] = this.debCol[i * 3 + 2] = 0;
      }
      this.debDirty = true;
    }
    this.refreshVeinColors(true);
    if (this.shaftMat) this.shaftMat.color.setHex(LAYERS[layerIndex(S.depth)].color);
  },

  update(dt) {
    if (!this.ok) return;
    this.time += dt;

    // 镜头跟随深度（大跳动时直接吸附，避免长距离缓动）
    const target = this.targetCamY();
    if (Math.abs(target - this.camY) > 4) this.camY = target;
    else this.camY = lerp(this.camY, target, Math.min(1, dt * 9));

    // 井壁跟随镜头 + 贴图锁定世界坐标（形成持续下坠感）
    this.shaft.position.y = this.camY;
    this.shaftTex.offset.y = (this.camY / CONFIG.fx.shaftHeight) * CONFIG.fx.textureRepeatY;

    // 矿层色渐变过渡
    this.shaftMat.color.lerp(this.tintTarget, Math.min(1, dt * 0.9));
    this.scene.fog.color.lerp(this.fogTarget, Math.min(1, dt * 0.7));
    this.renderer.setClearColor(this.scene.fog.color, 1);

    // 深度雾 / 压暗 / 矿脉异常
    const f = CONFIG.fx;
    const deepT = clamp((S.depth - f.fogStartDepth) / (f.fogEndDepth - f.fogStartDepth), 0, 1);
    this.deep = deepT;
    this.scene.fog.density = lerp(f.fogBase, f.fogMax, deepT * deepT);
    this.dirTop.intensity  = lerp(1.25, 0.35, deepT);
    this.dirDeep.intensity = lerp(0.30, 0.85, deepT);
    this.amb.intensity     = lerp(1.0, 0.55, deepT);

    // 钻头：转速随挖掘速度提升
    this.punch = Math.max(0, this.punch - dt * CONFIG.fx.shakeDecay);
    const spinSpeed = 2.2 + Math.min(26, D.dps * 0.045) + this.punch * 5;
    this.spin += spinSpeed * dt;
    this.drill.rotation.y = this.spin;
    this.drill.position.y = this.drillY() - this.punch * 0.35 + Math.sin(this.time * 2) * 0.06;
    this.drill.position.x = Math.sin(this.time * 1.3) * 0.08;
    this.drillGlow.position.set(0, this.drillY() - 0.6, 0);
    this.drillGlow.material.opacity = 0.55 + 0.25 * Math.sin(this.time * 3) + this.punch * 0.12;

    // 矿脉（含深部闪烁）
    this.refreshVeinColors(false);
    // 碎石
    this.updateDebris(dt);

    // 镜头晃动
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * CONFIG.fx.shakeDecay);
    const sh = this.shake;
    this.camera.position.set(
      Math.sin(this.time * 37) * sh * 0.55,
      this.camY + 0.6 + Math.cos(this.time * 41) * sh * 0.45,
      3.6 + Math.sin(this.time * 29) * sh * 0.3
    );
    this.camera.lookAt(0, this.camY - 7.2, 0);
    if (sh > 0.01) this.camera.rotation.z += Math.sin(this.time * 33) * sh * 0.02;

    this.renderer.render(this.scene, this.camera);
  },

  resize() {
    if (!this.renderer) return;
    const r = this.canvas.getBoundingClientRect();
    const w = Math.max(1, Math.floor(r.width)), h = Math.max(1, Math.floor(r.height));
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(w, h, false);
  }
};

const FX = {
  ok:false, rings:[], beams:[], flashEl:null, _tmp:null,

  init() {
    if (!Scene.ok || !Scene.scene) return false;
    this._tmp = new THREE.Color();
    const scene = Scene.scene;

    // 冲击波环池（水平放置，从钻头向外扩散）
    const ringGeo = new THREE.RingGeometry(0.88, 1.0, 36);
    for (let i = 0; i < 12; i++) {
      const mat = new THREE.MeshBasicMaterial({
        color: 0xffffff, transparent: true, opacity: 0, side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending, depthWrite: false, fog: false
      });
      const mesh = new THREE.Mesh(ringGeo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.visible = false;
      mesh.frustumCulled = false;
      scene.add(mesh);
      this.rings.push({ mesh: mesh, mat: mat, active: false, delay: 0, life: 0, life0: 1, from: 1, to: 8 });
    }
    // 光柱池（从钻头向上）
    const beamGeo = new THREE.CylinderGeometry(0.7, 1.1, 26, 14, 1, true);
    for (let i = 0; i < 5; i++) {
      const mat = new THREE.MeshBasicMaterial({
        color: 0xffffff, transparent: true, opacity: 0, side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending, depthWrite: false, fog: false
      });
      const mesh = new THREE.Mesh(beamGeo, mat);
      mesh.visible = false;
      mesh.frustumCulled = false;
      scene.add(mesh);
      this.beams.push({ mesh: mesh, mat: mat, active: false, delay: 0, life: 0, life0: 1 });
    }
    // 全屏闪光层（DOM，零 GPU 成本）
    this.flashEl = el('div', 'fx-flash');
    const app = $('app');
    if (app) app.appendChild(this.flashEl);
    this.ok = true;
    return true;
  },

  /** 播放某种升级 / 建筑的特效。level = 购买后的等级或数量（越高越华丽） */
  play(id, level) {
    if (!this.ok) return;
    const d = FX_DEFS[id];
    if (!d) return;
    const lv = Math.max(1, level || 1);
    const scale = clamp(1 + Math.log(lv) / 7, 1, 2.0);          // 等级越高越华丽
    const q = S.settings.quality === 'low' ? 0.5 : (S.settings.quality === 'high' ? 1.25 : 1);
    const on = (S.settings.fx !== false);

    if (d.sound && Sound[d.sound]) Sound[d.sound]();
    Scene.shake = Math.max(Scene.shake, (d.shake || 0.3) * (on ? 1 : 0.35));
    if (!on) return;                                            // 关闭特效：只保留音效与轻微晃动

    if (d.ring) {
      let n = d.ring.count || 1;
      if (q < 1) n = 1;                                        // 低画质只保留一环
      const gap = d.ring.gap || 0;
      for (let i = 0; i < Math.min(n, 4); i++) this._ring(d.ring, i * gap);
    }
    if (d.beam && q >= 1) this._beam(d.beam);
    if (d.parts) {
      Scene.emit(d.parts.mode, Math.round((d.parts.n || 20) * q * scale),
                 d.parts.color, (d.parts.power || 1));
    }
    if (d.flash) this.flash(d.flash[0], d.flash[1]);
    if (d.tip) {
      const owned = (level || 1);
      toast(d.tip + '　·　' + owned, 'cyan');
    }
  },

  _ring(cfg, delay) {
    for (let i = 0; i < this.rings.length; i++) {
      const r = this.rings[i];
      if (r.active) continue;
      r.active = true;
      r.delay = delay || 0;
      r.life = r.life0 = cfg.life || 0.75;
      r.from = cfg.from || 1;
      r.to = cfg.to || 8;
      r.mat.color.setHex(cfg.color === undefined ? 0xffffff : cfg.color);
      r.mat.opacity = 0;
      r.mesh.visible = false;
      return r;
    }
    return null;
  },

  _beam(cfg) {
    for (let i = 0; i < this.beams.length; i++) {
      const b = this.beams[i];
      if (b.active) continue;
      b.active = true;
      b.delay = 0;
      b.life = b.life0 = cfg.life || 0.7;
      b.mat.color.setHex(cfg.color === undefined ? 0xffffff : cfg.color);
      b.mat.opacity = 0;
      b.mesh.visible = false;
      return b;
    }
    return null;
  },

  /** 全屏闪光：DOM 层，用一次 transition 完成淡出；淡出后 display:none 避免常驻合成开销 */
  flash(color, alpha) {
    const e = this.flashEl;
    if (!e) return;
    if (this._flashTO) { clearTimeout(this._flashTO); this._flashTO = null; }
    e.style.display = 'block';
    e.style.transition = 'none';
    e.style.background = 'radial-gradient(circle at 50% 42%, ' + color + ', rgba(0,0,0,0) 68%)';
    e.style.opacity = String(alpha || 0.35);
    void e.offsetWidth;                       // 强制回流，使下一次 transition 生效
    e.style.transition = 'opacity .5s ease-out';
    e.style.opacity = '0';
    this._flashTO = setTimeout(function () { e.style.display = 'none'; }, 560);
  },

  update(dt) {
    if (!this.ok) return;
    const baseY = Scene.drillY() - 1.0;
    for (let i = 0; i < this.rings.length; i++) {
      const r = this.rings[i];
      if (!r.active) continue;
      if (r.delay > 0) { r.delay -= dt; continue; }
      r.mesh.visible = true;
      r.life -= dt;
      const k = clamp(r.life / r.life0, 0, 1);          // 1 → 0
      const s = lerp(r.to, r.from, k);                  // 由小扩散到大
      r.mesh.position.set(0, baseY, 0);
      r.mesh.scale.set(s, s, s);
      r.mesh.rotation.z += dt * 0.7;
      r.mat.opacity = k * k * 0.85;
      if (r.life <= 0) { r.active = false; r.mesh.visible = false; r.mat.opacity = 0; }
    }
    for (let i = 0; i < this.beams.length; i++) {
      const b = this.beams[i];
      if (!b.active) continue;
      if (b.delay > 0) { b.delay -= dt; continue; }
      b.mesh.visible = true;
      b.life -= dt;
      const k = clamp(b.life / b.life0, 0, 1);
      b.mesh.position.set(0, baseY + 12, 0);
      const w = lerp(1.4, 0.5, k);
      b.mesh.scale.set(w, 1, w);
      b.mesh.rotation.y += dt * 2.4;
      b.mat.opacity = k * 0.5;
      if (b.life <= 0) { b.active = false; b.mesh.visible = false; b.mat.opacity = 0; }
    }
  }
};

/* ---------------- 程序化贴图 / 模型 ---------------- */
function makeGlowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0.00, 'rgba(255,255,255,1)');
  grd.addColorStop(0.28, 'rgba(255,255,255,0.62)');
  grd.addColorStop(0.65, 'rgba(255,255,255,0.14)');
  grd.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.needsUpdate = true;
  return t;
}

/** 岩层贴图：分层色带 + 噪点 + 裂纹 + 孔洞（512×1024） */
function makeRockTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 1024;
  const g = c.getContext('2d');
  const W = c.width, H = c.height;

  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#3b342c');
  grd.addColorStop(0.5, '#4b4038');
  grd.addColorStop(1, '#2a2521');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);

  // 沉积色带
  let y = 0;
  while (y < H) {
    const h = randInt(12, 78);
    const s = randInt(26, 92);
    const warm = randInt(-12, 20);
    g.globalAlpha = rand(0.32, 0.8);
    g.fillStyle = 'rgb(' + clamp(s + warm + 20, 0, 255) + ',' +
                           clamp(s + Math.floor(warm * 0.4) + 14, 0, 255) + ',' +
                           clamp(s - Math.floor(warm * 0.3) + 8, 0, 255) + ')';
    g.fillRect(0, y, W, h);
    g.globalAlpha = 0.22;
    g.fillStyle = '#0c0a08';
    g.fillRect(0, y, W, randInt(1, 3));      // 层理线
    y += h;
  }
  g.globalAlpha = 1;

  // 噪点
  for (let i = 0; i < 13000; i++) {
    g.fillStyle = Math.random() < 0.55
      ? 'rgba(0,0,0,' + rand(0.05, 0.34).toFixed(3) + ')'
      : 'rgba(255,255,255,' + rand(0.03, 0.15).toFixed(3) + ')';
    g.fillRect((Math.random() * W) | 0, (Math.random() * H) | 0, randInt(1, 2), randInt(1, 2));
  }

  // 裂纹
  for (let i = 0; i < 76; i++) {
    let x = Math.random() * W, yy = Math.random() * H;
    g.strokeStyle = 'rgba(0,0,0,' + rand(0.22, 0.6).toFixed(3) + ')';
    g.lineWidth = rand(0.6, 2.3);
    g.beginPath(); g.moveTo(x, yy);
    const seg = randInt(3, 9);
    for (let s = 0; s < seg; s++) { x += rand(-46, 46); yy += rand(6, 56); g.lineTo(x, yy); }
    g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.045)';
    g.lineWidth = 0.9;
    g.stroke();
  }

  // 孔洞 / 溶蚀暗斑
  for (let i = 0; i < 28; i++) {
    const x = Math.random() * W, yy = Math.random() * H, r = rand(6, 28);
    const rg = g.createRadialGradient(x, yy, 0, x, yy, r);
    rg.addColorStop(0, 'rgba(0,0,0,0.72)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg;
    g.beginPath(); g.arc(x, yy, r, 0, Math.PI * 2); g.fill();
  }

  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.RepeatWrapping;
  t.needsUpdate = true;
  return t;
}

/** 钻头：圆锥 + 圆柱 + 刀翼 + 环 */
function buildDrill() {
  const g = new THREE.Group();
  const body = new THREE.MeshPhongMaterial({ color: 0x4a5058, emissive: 0x0a0d10, shininess: 70, specular: 0x9aa4b0 });
  const tip  = new THREE.MeshPhongMaterial({ color: 0xffa63a, emissive: 0x6e3200, shininess: 95, specular: 0xffd9a0 });
  const ring = new THREE.MeshPhongMaterial({ color: 0x2ad0c8, emissive: 0x0b4740, shininess: 80 });

  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 3.0, 16), body);
  g.add(stem);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.80, 0.62, 0.45, 16), body);
  cap.position.y = 1.66;
  g.add(cap);
  const cone = new THREE.Mesh(new THREE.ConeGeometry(1.15, 2.5, 18), tip);
  cone.rotation.x = Math.PI;                 // 尖端朝下
  cone.position.y = -2.75;
  g.add(cone);
  // 三片刀翼
  for (let i = 0; i < 3; i++) {
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.9, 0.62), tip);
    const a = i / 3 * Math.PI * 2;
    blade.position.set(Math.cos(a) * 0.72, -2.1, Math.sin(a) * 0.72);
    blade.rotation.y = -a;
    blade.rotation.z = 0.22;
    g.add(blade);
  }
  const tr = new THREE.Mesh(new THREE.TorusGeometry(0.78, 0.11, 8, 20), ring);
  tr.rotation.x = Math.PI / 2;
  tr.position.y = -1.5;
  g.add(tr);
  return g;
}
