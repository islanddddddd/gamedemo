/* ---------------- 主题（配色随深度演变） ---------------- */
function hexCss(n) { return '#' + ('000000' + (n >>> 0).toString(16)).slice(-6); }
function applyTheme(li) {
  const lay = LAYERS[clamp(li, 0, LAYERS.length - 1)];
  document.documentElement.style.setProperty('--accent', hexCss(lay.color));
  document.documentElement.style.setProperty('--accent2', li >= 5 ? '#38e0d0' : '#7fd7f0');
  document.documentElement.style.setProperty('--bg', hexCss(lay.fog));
  document.body.style.background = hexCss(lay.fog);
  updateDarkness();
}
function updateDarkness() {
  const d = $('dark');
  if (!d) return;
  d.style.opacity = clamp((S.depth - CONFIG.fx.darkStartDepth) / 6000, 0, 0.9).toFixed(3);
}

/* ---------------- Toast / 浮动数字 / 抖屏 ---------------- */
function toast(msg, cls) {
  const box = $('toasts');
  if (!box) return;
  const t = el('div', 'toast' + (cls ? ' ' + cls : ''), msg);
  box.appendChild(t);
  setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 3200);
}
function floater(text, x, y, cls) {
  const box = $('floaters');
  if (!box) return;
  const f = el('div', 'floater' + (cls ? ' ' + cls : ''), text);
  f.style.left = clamp(x || window.innerWidth / 2, 30, window.innerWidth - 30) + 'px';
  f.style.top  = clamp(y || window.innerHeight * 0.3, 40, window.innerHeight - 40) + 'px';
  box.appendChild(f);
  setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 1050);
}
let shakeTimer = null;
function shakeScreen(power) {
  const app = $('app');
  if (!app) return;
  app.classList.remove('shake');
  void app.offsetWidth;
  app.classList.add('shake');
  if (shakeTimer) clearTimeout(shakeTimer);
  shakeTimer = setTimeout(function () { app.classList.remove('shake'); }, 470);
  Scene.shake = Math.max(Scene.shake, power || 0.6);
}
let glitchTimer = null;
function glitch() {
  const app = $('app');
  if (!app) return;
  app.classList.remove('glitch');
  void app.offsetWidth;
  app.classList.add('glitch');
  if (glitchTimer) clearTimeout(glitchTimer);
  glitchTimer = setTimeout(function () { app.classList.remove('glitch'); }, 1200);
}

/* ---------------- 加密乱码（未解锁档案） ---------------- */
function scramble(seed, len) {
  const chars = '▓▒░#@%&*?!▚▞╳§¤≠∞⌁⍀⎔⏃⏚';
  let x = (seed * 9301 + 49297) % 233280;
  let s = '';
  for (let i = 0; i < len; i++) {
    x = (x * 9301 + 49297) % 233280;
    s += chars[Math.floor(x / 233280 * chars.length)];
    if (i % 22 === 21) s += ' ';
  }
  return s;
}

/* ---------------- 通用弹窗 ---------------- */
function openModal(opt) {
  const layer = $('modalLayer');
  if (!layer) return null;
  layer.innerHTML = '';
  const m = el('div', 'modal' + (opt.cls ? ' ' + opt.cls : ''));
  const hd = el('div', 'modal-hd');
  hd.appendChild(el('div', 'mt', opt.title || ''));
  if (opt.sub) hd.appendChild(el('div', 'ms', opt.sub));
  const bd = el('div', 'modal-bd');
  if (typeof opt.body === 'string') bd.innerHTML = opt.body;
  else if (opt.body) bd.appendChild(opt.body);
  m.appendChild(hd); m.appendChild(bd);

  const ft = el('div', 'modal-ft');
  (opt.buttons || [{ label: '关闭' }]).forEach(function (b) {
    const btn = el('button', 'btn ' + (b.cls || 'ghost'), b.label || '确定');
    btn.addEventListener('click', function () {
      Sound.ui();
      if (b.onClick) b.onClick(m);
      else closeModal();
    });
    ft.appendChild(btn);
  });
  m.appendChild(ft);
  layer.appendChild(m);
  layer.classList.remove('hidden');
  UI.modalOpen = true;
  UI._modal = m;
  if (opt.dismissible !== false) {
    layer.onclick = function (e) { if (e.target === layer) closeModal(); };
  } else { layer.onclick = null; }
  return m;
}
function closeModal() {
  const layer = $('modalLayer');
  if (!layer) return;
  if (UI._typer) { UI._typer.stop(); UI._typer = null; }
  layer.innerHTML = '';
  layer.classList.add('hidden');
  layer.onclick = null;
  UI.modalOpen = false;
  UI._modal = null;
  // 日志排队：关掉一条就弹下一条
  if (logQueue.length) setTimeout(function () { showLogModal(logQueue.shift()); }, 180);
}

/* ---------------- 打字机 ---------------- */
function typewriter(container, text, speed, onDone) {
  const txt = el('span', '', '');
  const caret = el('span', 'caret', '\u00a0');
  container.appendChild(txt);
  container.appendChild(caret);
  let i = 0, finished = false;
  const finish = function () {
    if (finished) return;
    finished = true;
    clearInterval(timer);
    txt.textContent = text;
    if (caret.parentNode) caret.parentNode.removeChild(caret);
    if (onDone) onDone();
  };
  const timer = setInterval(function () {
    i = Math.min(text.length, i + (Math.random() < 0.3 ? 2 : 1));
    txt.textContent = text.slice(0, i);
    if (i >= text.length) finish();
  }, speed);
  return { stop: function () { clearInterval(timer); }, skip: finish };
}

/* ---------------- 勘探日志弹窗 ---------------- */
function showLogModal(L, reread) {
  if (!L) { closeModal(); return; }
  const ch = CHAPTERS.filter(function (c) { return c.id === L.ch; })[0] || CHAPTERS[0];
  const idx = LOGS.indexOf(L);
  const body = el('div', '');
  body.appendChild(el('div', 'logmeta',
    '档案编号 ' + L.id + '　·　阶段《' + ch.name + '》\n记录深度 ' + fmt(L.depth) + ' m'));
  const twBox = el('div', 'typing');
  body.appendChild(twBox);
  const rewardBox = el('div', 'reward');
  rewardBox.style.display = 'none';
  body.appendChild(rewardBox);

  openModal({
    title: '勘探日志 #' + String(idx + 1).padStart(3, '0'),
    sub: ch.name + '　/　' + ch.range,
    cls: 'warn',
    body: body,
    dismissible: true,
    buttons: [{ label: '确认', cls: 'primary', onClick: function () { closeModal(); } }]
  });

  UI._typer = typewriter(twBox, L.text, CONFIG.narrative.typeSpeed, function () {
    UI._typer = null;
    if (reread) { rewardBox.style.display = 'block'; rewardBox.textContent = '已归档 · 无重复奖励'; return; }
    rewardBox.style.display = 'block';
    rewardBox.textContent = (L.reward === 'coins')
      ? '奖励已发放：金币爆发（按当前产出结算）'
      : '奖励已发放：永久产能 +' + Math.round(CONFIG.narrative.rewardProdPct * 100) + '%';
  });
  // 点击正文可跳过打字
  twBox.addEventListener('click', function () { if (UI._typer) UI._typer.skip(); });

  if (!reread) {
    Sound.logTone();
    shakeScreen(0.55);
    glitch();
    UI.archBuilt = false;
  }
}

/* ---------------- 购买行 ---------------- */
function createRow(opt) {
  const root = el('div', 'item');
  const icon = el('div', 'item-icon', opt.icon);
  const main = el('div', 'item-main');
  const title = el('div', 'item-title');
  const nm = el('span', 'nm', opt.name);
  const lvl = el('span', 'lvl', '');
  title.appendChild(nm); title.appendChild(lvl);
  const desc = el('div', 'item-desc', opt.desc);
  const meta = el('div', 'item-meta', '');
  main.appendChild(title); main.appendChild(desc); main.appendChild(meta);

  const buy = el('div', 'item-buy');
  const btns = [];
  [['1', '买 1'], ['10', '买 10'], ['max', '最大']].forEach(function (p) {
    const b = el('button', 'buy' + (p[0] === 'max' ? ' max' : ''));
    b.appendChild(el('b', '', p[1]));
    const sp = el('span', '', '');
    b.appendChild(sp);
    b.addEventListener('click', function () { opt.onBuy(p[0]); });
    buy.appendChild(b);
    btns.push({ btn: b, cost: sp, n: p[0] });
  });
  root.appendChild(icon); root.appendChild(main); root.appendChild(buy);
  const row = { root: root, lvl: lvl, meta: meta, btns: btns, update: opt.update, kind: opt.kind, data: opt.data };
  UI.rows.push(row);
  return row;
}

function pct(x) { return Math.round(x * 100) + '%'; }

function updateBuildingRow(b, row) {
  const unlocked = isUnlockedBuilding(b);
  const own = S.b[b.id] || 0;
  row.root.classList.toggle('locked', !unlocked);
  row.lvl.textContent = own > 0 ? ('×' + own) : '';

  let m = '';
  if (b.dps)      m += '+' + fmt(b.dps) + ' m/s';
  if (b.dpsAdd)   m += ' 挖掘速度 +' + pct(b.dpsAdd);
  if (b.oreAdd)   m += ' 矿石 +' + pct(b.oreAdd);
  if (b.priceAdd) m += ' 售价 +' + pct(b.priceAdd);
  if (own > 0 && b.dps) m += ' <span class="muted">· 合计 ' + fmt(b.dps * own) + ' m/s</span>';
  row.meta.innerHTML = m;

  if (!unlocked) {
    const why = (b.needPrestige && S.prestige < b.needPrestige)
      ? ('第 ' + b.needPrestige + ' 周目') : (fmt(b.unlock) + ' m');
    row.btns.forEach(function (x) { x.btn.disabled = true; x.btn.classList.remove('can'); x.cost.textContent = '🔒 ' + why; });
    return;
  }
  row.btns.forEach(function (x) {
    const n = x.n === 'max' ? buildingMax(b) : parseInt(x.n, 10);
    const cost = buildingCost(b, n);
    const can = n > 0 && S.coins >= cost;
    x.btn.disabled = !can;
    x.btn.classList.toggle('can', can);
    x.cost.textContent = x.n === 'max'
      ? (n > 0 ? ('×' + n + ' · ' + fmt(cost)) : '—')
      : fmt(cost);
  });
}

function updateUpgradeRow(u, row) {
  const lv = S.u[u.id] || 0;
  row.lvl.textContent = 'Lv.' + lv;
  let m = '';
  if (u.kind === 'clickPow') m = '点击深度 ×' + Math.pow(u.per, lv).toFixed(2) + ' <span class="muted">· 单次 +' + fmtDepth(D.clickDepth) + ' m</span>';
  else if (u.kind === 'oreAdd')   m = '矿石产出 +' + pct(u.per * lv) + ' <span class="muted">· 下一级 +' + pct(u.per) + '</span>';
  else if (u.kind === 'priceAdd') m = '矿石售价 +' + pct(u.per * lv) + ' <span class="muted">· 下一级 +' + pct(u.per) + '</span>';
  else if (u.kind === 'speedAdd') m = '全局挖掘速度 +' + pct(u.per * lv) + ' <span class="muted">· 下一级 +' + pct(u.per) + '</span>';
  row.meta.innerHTML = m;
  row.btns.forEach(function (x) {
    const n = x.n === 'max' ? upgradeMax(u) : parseInt(x.n, 10);
    const cost = upgradeCost(u, n);
    const can = n > 0 && S.coins >= cost;
    x.btn.disabled = !can;
    x.btn.classList.toggle('can', can);
    x.cost.textContent = x.n === 'max'
      ? (n > 0 ? ('×' + n + ' · ' + fmt(cost)) : '—')
      : fmt(cost);
  });
}

    const data = exportSave();
    const ta = document.createElement('textarea');
    ta.value = data;
    ta.readOnly = true;
    const wrap = el('div', '');
    wrap.appendChild(ta);
    const btnCp = el('button', 'btn block', '复制到剪贴板');
    btnCp.style.marginTop = '8px';
    btnCp.addEventListener('click', function () {
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (!ok && navigator.clipboard) { navigator.clipboard.writeText(ta.value); ok = true; }
      toast(ok ? '已复制到剪贴板' : '请手动长按选中复制', 'cyan');
    });
    wrap.appendChild(btnCp);
    openModal({ title: '导出存档', sub: 'BASE64 · ' + data.length + ' 字符', body: wrap,
      buttons: [{ label: '关闭', cls: 'ghost' }] });
  });
  bImp.addEventListener('click', function () {
    const ta = document.createElement('textarea');
    ta.placeholder = '在此粘贴 base64 存档文本…';
    openModal({
      title: '导入存档', sub: 'PASTE BASE64', body: ta,
      buttons: [
        { label: '取消', cls: 'ghost' },
        { label: '导入', cls: 'primary', onClick: function () {
            const ok = importSave(ta.value);
            closeModal();
            if (ok) {
              applyTheme(D.layerIdx);
              Scene.hardResetVisual();
              Scene.setQuality(S.settings.quality);
              Sound.setVolumes();
              buildSettingsPane();        // 重建以同步音量滑块 / 画质按钮状态
              toast('存档导入成功', 'cyan');
            } else toast('导入失败：文本无效');
          } }
      ]
    });
  });
  bRst.addEventListener('click', function () {
    openModal({
      title: '重置存档？', sub: 'IRREVERSIBLE', cls: 'warn',
      body: '<div class="card-note">将清空深度、金币、矿石、全部建筑与升级、岩芯、档案与成就。<br>此操作不可撤销，建议先导出备份。</div>',
      buttons: [
        { label: '取消', cls: 'ghost' },
        { label: '确认重置', cls: 'danger', onClick: function () {
            hardReset(); closeModal();
            applyTheme(0); Scene.hardResetVisual();
            toast('存档已重置');
          } }
      ]
    });
  });

  /* 统计 */
  const st = el('div', 'card');
  st.appendChild(el('div', 'card-title', '统计'));
  const statBox = el('div', '');
  statBox.id = 'statBox';
  st.appendChild(statBox);
  pane.appendChild(st);
}

function refreshStats() {
  const box = $('statBox');
  if (!box) return;
  const rows = [
    ['游戏时长', fmtTime(S.stats.playTime)],
    ['挖掘次数', fmt(S.stats.clicks)],
    ['累计金币', fmt(S.totalCoins)],
    ['累计矿石', fmt(S.totalOre)],
    ['最深深度', fmtDepth(S.maxDepth) + ' m'],
    ['转生次数', fmt(S.prestige)],
    ['岩芯', fmt(S.cores)],
    ['永久产能', '×' + S.prodMult.toFixed(2)]
  ];
  box.innerHTML = rows.map(function (r) {
    return '<div class="row"><div class="kv">' + r[0] + '</div><div class="kv"><b>' + r[1] + '</b></div></div>';
  }).join('');
}

/* ---------------- 转生确认 ---------------- */
function confirmPrestige() {
  const gain = coresGain();
  openModal({
    title: '提取岩芯 · 转生', sub: 'CORE EXTRACTION', cls: 'warn',
    body: '<div class="card-note">' +
      '本次最深深度 <b>' + fmtDepth(S.maxDepth) + ' m</b> → 获得 <b class="amber">' + gain + '</b> 枚岩芯。<br><br>' +
      '<b>重置：</b>深度、金币、矿石、全部矿工 / 设施、全部钻探升级。<br>' +
      '<b>保留：</b>档案日志、成就、转生次数、永久产能、设置。<br><br>' +
      '转生后岩芯共 ' + (S.cores + gain) + ' 枚：挖掘速度 +' + pct((S.cores + gain) * CONFIG.prestige.speedPerCore) +
      '、矿石售价 +' + pct((S.cores + gain) * CONFIG.prestige.pricePerCore) + '。</div>',
    buttons: [
      { label: '取消', cls: 'ghost' },
      { label: '确认提取', cls: 'primary', onClick: function () {
          const g = doPrestige();
          closeModal();
          if (g) toast('转生完成：获得 ' + g + ' 枚岩芯，共 ' + S.cores + ' 枚', 'cyan');
        } }
    ]
  });
}

/* ---------------- HUD ---------------- */
function rollTo(cur, target, k) {
  if (!isFinite(target)) return cur;
  const diff = target - cur;
  if (Math.abs(diff) < Math.max(0.5, Math.abs(target) * 0.002)) return target;
  return cur + diff * clamp(k, 0, 1);
}
function updateHUD(dt) {
  const k = clamp(dt * 9, 0, 1);
  Disp.depth = rollTo(Disp.depth, S.depth, k);
  Disp.coins = rollTo(Disp.coins, S.coins, k);
  Disp.ore   = rollTo(Disp.ore,   S.ore,   k);
  Disp.cps   = rollTo(Disp.cps,   D.cps,   k);

  $('hDepth').textContent = fmtDepth(Disp.depth);
  $('hCoins').textContent = fmt(Disp.coins);
  $('hOre').textContent   = fmt(Disp.ore);
  $('hCps').textContent   = fmt(Disp.cps);
  $('hCores').textContent = fmt(S.cores);
  $('hLayer').textContent = D.layer.name;
  $('hOff').textContent   = fmt(D.cps * 3600);
  $('digSub').textContent = '+' + fmtDepth(D.clickDepth) + 'm';

  const nl = nextLogInfo();
  const chip = $('hNextLog');
  if (nl) {
    chip.textContent = '下一条日志 ' + fmtDepth(nl.remain) + 'm';
    chip.classList.toggle('near', nl.remain < 150);
  } else {
    chip.textContent = '全部日志已解锁';
    chip.classList.remove('near');
  }

  // 矿层进度条
  const cur = LAYERS[D.layerIdx], nxt = LAYERS[D.layerIdx + 1];
  const p = nxt ? clamp((S.depth - cur.from) / (nxt.from - cur.from), 0, 1) : 1;
  $('depthBarFill').style.width = (p * 100).toFixed(1) + '%';

  // 出售卡片
  const so = $('sellOre'), sp = $('sellPrice'), sr = $('sellRate');
  if (so) so.textContent = fmt(S.ore);
  if (sp) sp.textContent = fmt(D.unitPrice);
  if (sr) sr.textContent = S.autosell ? '自动出售中' : '';
  const pm = $('preMax'), pg = $('preGain');
  if (pm) pm.textContent = fmtDepth(S.maxDepth);
  if (pg) pg.textContent = fmt(coresGain());
  if (UI._btnPre) UI._btnPre.disabled = !canPrestige();
}

/* ---------------- 面板刷新 ---------------- */
function refreshRows() {
  for (let i = 0; i < UI.rows.length; i++) {
    const r = UI.rows[i];
    if (r.update) r.update(r);
  }
}
function refreshAllUI() {
  refreshRows();
  if (UI._btnAuto) {
    UI._btnAuto.classList.toggle('on', S.autosell);
    UI._btnAuto.textContent = S.autosell ? '自动出售 · 开' : '自动出售 · 关';
  }
  updateHUD(0);
  refreshStats();
  if (UI.activeTab === 'arch') buildArchivePane();
}

/* ==========================================================================
 * §9  主循环与启动
 * ========================================================================== */
let lastT = 0, uiAcc = 0, bgmAcc = 0, statAcc = 0;

function frame(now) {
  requestAnimationFrame(frame);
  const t = now / 1000;
  let dt = lastT ? (t - lastT) : 1 / 60;
  lastT = t;

  if (dt > 1.5) {
    // 页面曾在后台：按离线规则补算（上限 8 小时）
    const res = settleOffline(dt);
    if (res && res.seconds >= CONFIG.offlineMinSec) showOfflineModal(res);
    dt = 1 / 60;
  } else {
    dt = Math.min(Math.max(dt, 0), 0.12);
  }

  tick(dt);
  updateHUD(dt);
  Scene.update(dt);
  FX.update(dt);
  tickAutosave(dt);

  uiAcc += dt;
  if (uiAcc >= 0.2) {
    uiAcc = 0;
    recalc();
    refreshRows();
    updateDarkness();
    checkAchievements();
    if (UI.activeTab === 'arch' && !UI.archBuilt) buildArchivePane();
  }
  bgmAcc += dt;
  if (bgmAcc >= 2) { bgmAcc = 0; Sound.updateBGM(S.depth); }
  statAcc += dt;
  if (statAcc >= 1) { statAcc = 0; if (UI.activeTab === 'set') refreshStats(); }
}

function bindEvents() {
  const canvas = $('gl');

  // 点击画面挖掘
  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    dig(e.clientX, e.clientY);
  });
  $('digBtn').addEventListener('pointerdown', function (e) {
    e.preventDefault();
    ensureAudio();
    const r = $('digBtn').getBoundingClientRect();
    $('digBtn').classList.remove('pulse'); void $('digBtn').offsetWidth; $('digBtn').classList.add('pulse');
    dig(r.left + r.width / 2, r.top + r.height / 2);
  });

  // 标签页
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (tab) {
    tab.addEventListener('click', function () {
      Sound.ui();
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (x) { x.classList.remove('active'); });
      tab.classList.add('active');
      Array.prototype.forEach.call(document.querySelectorAll('.tabpane'), function (p) { p.classList.remove('active'); });
      UI.activeTab = tab.getAttribute('data-tab');
      $('pane-' + UI.activeTab).classList.add('active');
      if (UI.activeTab === 'arch') buildArchivePane();
      if (UI.activeTab === 'set') refreshStats();
    });
  });

  // 窗口尺寸
  let rzTimer = null;
  window.addEventListener('resize', function () {
    if (rzTimer) clearTimeout(rzTimer);
    rzTimer = setTimeout(function () { Scene.resize(); }, 120);
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () { Scene.resize(); }, 350);
  });

  // 后台暂停音频
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { Sound.suspend(); saveGame(); }
    else { lastT = 0; Sound.resume(); }
  });
  window.addEventListener('pagehide', saveGame);
  window.addEventListener('beforeunload', saveGame);
}

/* 首次交互后启动音频上下文 */
let audioReady = false;
function ensureAudio() {
  if (audioReady) return;
  audioReady = true;
  if (!Sound.init()) return;
  Sound.setVolumes();
  if (!S.settings.muted) Sound.startBGM();
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
    window.removeEventListener(ev, ensureAudio);
  });
}

function boot() {
  const hadSave = loadGame();
  recalc();
  S.layerIdx = layerIndex(S.depth);      // 避免开局误触发里程碑

  const canvas = $('gl');
  const ok3d = Scene.init(canvas);
  if (!ok3d) {
    console.warn('[ABYSS] 3D 场景不可用，游戏逻辑继续运行');
    const msg = el('div', 'card-note', '当前环境不支持 WebGL，3D 画面已停用，但玩法与数值仍可正常进行。');
    msg.style.cssText = 'position:absolute;top:45%;left:0;right:0;text-align:center;padding:0 24px;';
    $('app').appendChild(msg);
  } else {
    Scene.hardResetVisual();
  }
  FX.init();

  UI.rows = [];
  UI.activeTab = 'drill';
  buildDrillPane();
  buildCrewPane();
  buildArchivePane();
  buildSettingsPane();

  applyTheme(D.layerIdx);
  refreshAllUI();

  // 离线结算
  if (hadSave) {
    const elapsed = (Date.now() - (S.stats.lastSave || Date.now())) / 1000;
    if (elapsed >= CONFIG.offlineMinSec) {
      const res = settleOffline(elapsed);
      if (res) {
        checkLayer();
        showOfflineModal(res);
      }
    }
  }
  checkAchievements();
  bindEvents();
  if (S.migrated) {
    setTimeout(function () {
      toast('数值平衡已更新：经济进度重置，档案 / 成就 / 岩芯保留', 'cyan');
    }, 1200);
    S.migrated = false;
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
    window.addEventListener(ev, ensureAudio, { passive: true });
  });

  $('boot').classList.add('hidden');
  requestAnimationFrame(frame);

  if (!hadSave) {
    setTimeout(function () {
      toast('点击井壁或右下角按钮开始挖掘', 'cyan');
    }, 700);
  }
}

/* 暴露给 index.html 的启动接口（同时方便调试与离线数值模拟） */
window.ABYSS = {
  boot: boot,
  get state() { return S; },
  get derived() { return D; },
  CONFIG: CONFIG, LOGS: LOGS, LAYERS: LAYERS, BUILDINGS: BUILDINGS, UPGRADES: UPGRADES,
  FX: FX, FX_DEFS: FX_DEFS,
  save: saveGame, load: loadGame, export: exportSave, import: importSave,
  addCoins: function (n) { S.coins += n; recalc(); },
  warp: function (d) { S.depth = d; if (d > S.maxDepth) S.maxDepth = d; recalc(); checkLogs(); },
  /* 调试 / 数值模拟：可直接复用游戏内的真实公式跑平衡测试 */
  debug: {
    recalc: recalc, advance: advance, grantReward: grantReward,
    buyBuilding: buyBuilding, buyUpgrade: buyUpgrade,
    buildingCost: buildingCost, upgradeCost: upgradeCost,
    buildingMax: buildingMax, upgradeMax: upgradeMax,
    coresGain: coresGain, layerIndex: layerIndex, resistance: resistance,
    get D() { return D; }, UI: UI, Scene: Scene, FX: FX
  }
};

})();
}
</script>
<script>
/* ==========================================================================
   引导器：按顺序尝试 CDN 载入 Three.js（UMD 构建，兼容 file:// 直接双击打开），
   全部失败后提示用户。Three.js 就绪后执行内联的主程序并启动游戏。
   如想完全离线运行：把下面 CDN 数组的第一项改成本地 three.min.js 的路径。
   ========================================================================== */
(function () {
  var BOOT = document.getElementById('boot');
  var MSG  = document.getElementById('bootMsg');

  var CDN = [
    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js',
    'https://unpkg.com/three@0.149.0/build/three.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'
  ];
  var i = 0;

  function loadNext() {
    if (window.THREE) return startMain();
    if (i >= CDN.length) return fail('无法载入 Three.js');
    var url = CDN[i++];
    MSG.textContent = '正在载入 3D 引擎… (' + i + '/' + CDN.length + ')';
    var s = document.createElement('script');
    s.src = url;
    s.async = false;
    s.onload  = function () { window.THREE ? startMain() : loadNext(); };
    s.onerror = loadNext;
    document.head.appendChild(s);
  }

  function startMain() {
    MSG.textContent = '正在启动…';
    try {
      __ABYSS_MAIN__();                       // 执行内联主程序（注册 window.ABYSS）
      if (window.ABYSS && window.ABYSS.boot) window.ABYSS.boot();
      else fail('主程序未导出启动接口');
    } catch (e) {
      fail('启动异常：' + (e && e.message ? e.message : e));
      console.error(e);
    }
  }

  function fail(msg) {
    BOOT.classList.remove('hidden');
    BOOT.classList.add('boot-error');
    MSG.innerHTML = msg +
      '<div class="boot-tip">本作通过 CDN 载入 Three.js，请确认网络连通；' +
      '若需完全离线，请把本文件中 CDN 数组第一项改成本地 three.min.js 的路径。</div>';
  }
  window.__ABYSS_FAIL = fail;

  loadNext();
})();
</script>
