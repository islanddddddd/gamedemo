<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CODE ROGUE</title>
<style>
:root{
  --bg:#0A0E0A; --green:#00FF41; --cyan:#00E5FF; --amber:#FFB000;
  --gold:#FFD700; --purple:#B388FF; --red:#FF3B30; --shield:#4FC3F7;
  --dim:#0F5C22; --dim2:#073d15; --panel:#0d140d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--green);
  font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono","Noto Sans Mono CJK SC",monospace;
  font-size:13px; line-height:1.45; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px);
  opacity:.35;
}
#app{display:flex;flex-direction:column;height:100vh;max-width:1180px;margin:0 auto;padding:6px 10px;gap:5px}

/* ---------- 状态条 ---------- */
#status{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border:1px solid var(--dim);background:var(--panel);padding:5px 8px;flex:0 0 auto}
.st{display:flex;align-items:center;gap:4px;white-space:nowrap}
.st .lb{color:var(--dim);font-size:11px}
.bar{display:inline-block;width:78px;height:9px;border:1px solid var(--dim);position:relative;background:#000}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--green);display:block}
.bar.hp i{background:var(--red)} .bar.sh i{background:var(--shield)} .bar.mem i{background:var(--purple)}
#stFloor{color:var(--amber)} #stGold{color:var(--gold)}
.spacer{flex:1}
.mini{font-size:11px;color:var(--cyan);cursor:pointer;border:1px solid var(--dim);padding:1px 6px}
.mini:hover{border-color:var(--green);color:var(--green)}

/* ---------- 敌人区 ---------- */
#enemyZone{flex:0 0 auto;border:1px solid var(--dim);background:var(--panel);padding:6px;min-height:150px}
#enemyList{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.enemy{text-align:center;min-width:150px;position:relative}
.enemy.dead{opacity:.25;filter:grayscale(1)}
.art{font-size:12px;line-height:1.15;color:var(--green);white-space:pre;text-shadow:0 0 6px rgba(0,255,65,.35)}
.art.boss{color:var(--amber);text-shadow:0 0 8px rgba(255,176,0,.5)}
.art.hurt{animation:shake .25s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ename{color:var(--white,#fff);font-size:12px;margin-top:3px}
.ehp{width:140px;height:10px;border:1px solid var(--dim);margin:3px auto 0;position:relative;background:#000}
.ehp i{position:absolute;left:0;top:0;bottom:0;background:var(--red)}
.ehp b{position:absolute;left:0;right:0;top:-1px;font-size:9px;color:#fff;font-weight:400;text-align:center}
.intent{margin:4px auto 0;border:1px solid var(--amber);background:#150f00;color:var(--amber);padding:2px 6px;font-size:11px;max-width:190px}
.intent.break{border-color:var(--purple);color:var(--purple);background:#0d0820}
.intent.buff{border-color:var(--cyan);color:var(--cyan);background:#001318}
.intent.charge{border-color:var(--dim);color:var(--dim)}
.armor{font-size:10px;color:var(--shield)}
.mask{font-size:10px;color:var(--gold)}

/* ---------- 语法树 ---------- */
#treeZone{flex:0 0 auto;border:1px solid var(--dim);background:#070c07;height:104px;overflow:auto;position:relative}
#treeInner{position:relative;min-height:100px;padding:4px}
.tn{position:absolute;width:44px;text-align:center;font-size:13px;padding:1px 0;border:1px solid transparent;border-radius:2px}
.tn.num,.tn.var{color:#fff;border-color:#444;background:#111}
.tn.op{color:var(--amber);border-color:var(--amber);background:#1a1100}
.tn.paren{color:var(--gold)}
.tn.bad{color:var(--red);border-color:var(--red)}
#treeLinks{position:absolute;left:0;top:0;pointer-events:none}
#treeEmpty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px}

/* ---------- 编辑器 ---------- */
#editorZone{flex:1 1 auto;border:1px solid var(--dim);background:var(--panel);padding:6px;display:flex;flex-direction:column;gap:5px;min-height:0}
.etabs{display:flex;gap:4px;flex-wrap:wrap}
.etab{border:1px solid var(--dim);padding:1px 8px;font-size:11px;cursor:pointer;color:var(--dim)}
.etab.on{border-color:var(--green);color:var(--green);background:#04180a}
.etab .cost{color:var(--amber)}
#exprRow{border:1px dashed var(--dim);min-height:38px;display:flex;align-items:center;gap:2px;padding:4px;flex-wrap:wrap;position:relative;background:#050805}
#exprRow.drop{background:#0a1c0d;border-color:var(--green)}
.gap{width:5px;height:26px;background:transparent}
.gap.hot{background:var(--green);box-shadow:0 0 6px var(--green)}
.tk{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 5px;border:1px solid #333;background:#0e140e;color:#fff;cursor:grab;user-select:none;font-size:13px}
.tk.var{color:#fff;border-color:#666}
.tk.const{color:#fff;border-color:#666;background:#141414}
.tk.op{color:var(--amber);border-color:var(--amber);background:#1a1100}
.tk.paren{color:var(--gold);border-color:var(--gold);background:#161200}
.tk.frozen{opacity:.45;border-style:dashed;border-color:var(--red);color:var(--red)}
.tk.ghost{opacity:.35}
.tk.dragging{opacity:.25}
#tray{border:1px solid var(--dim);min-height:34px;display:flex;gap:3px;padding:4px;flex-wrap:wrap;align-items:center;background:#050805;max-height:96px;overflow:auto}
.traylb{color:var(--dim);font-size:11px;margin-right:2px}
#evalLine{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
#evalVal{font-size:20px;color:var(--green);min-width:60px}
#evalVal.warn{color:var(--amber)} #evalVal.bad{color:var(--red);animation:blink .6s infinite}
@keyframes blink{50%{opacity:.35}}
#evalNote{color:var(--dim);font-size:11px}
.warnline{color:var(--amber);font-size:11px}
.errline{color:var(--red);font-size:11px}
#fnRow{display:flex;gap:5px;flex-wrap:wrap}
.fn{border:1px solid var(--purple);background:#100818;color:var(--purple);padding:2px 8px;font-size:12px;cursor:pointer}
.fn:hover{background:#1c0f2c}
.fn.on{background:var(--purple);color:#000}
.fn.no{opacity:.35;cursor:not-allowed}
.fn .m{font-size:10px;opacity:.8}
#actRow{display:flex;gap:8px;align-items:center}
button.act{border:1px solid var(--green);background:#04180a;color:var(--green);padding:5px 16px;font-family:inherit;font-size:13px;cursor:pointer}
button.act:hover{background:var(--green);color:#000}
button.act:disabled{opacity:.3;cursor:not-allowed}
button.ghost{border-color:var(--dim);color:var(--dim)}

/* ---------- 日志 ---------- */
#logZone{flex:0 0 auto;height:118px;border:1px solid var(--dim);background:#050805;overflow:auto;padding:4px 8px;font-size:12px}
#logZone div{white-space:pre-wrap}
.lc{color:var(--cyan)} .lw{color:var(--amber)} .le{color:var(--red)} .lg{color:var(--green)} .lw2{color:var(--dim)} .lp{color:var(--purple)} .lwh{color:#fff}

/* ---------- overlay ---------- */
#overlay{position:fixed;inset:0;background:rgba(3,6,3,.94);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
#overlay.on{display:flex}
.card{border:1px solid var(--green);background:var(--bg);max-width:880px;width:100%;padding:14px 16px;max-height:92vh;overflow:auto;box-shadow:0 0 40px rgba(0,255,65,.15)}
.card h2{font-size:16px;margin-bottom:4px;color:var(--green);font-weight:400}
.card h3{font-size:13px;margin:10px 0 4px;color:var(--amber);font-weight:400}
.card .sub{color:var(--dim);font-size:12px;margin-bottom:8px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.opt{border:1px solid var(--dim);padding:7px 10px;cursor:pointer;min-width:210px;flex:1 1 210px;background:var(--panel)}
.opt:hover{border-color:var(--green);background:#04180a}
.opt .t{color:#fff;font-size:13px}
.opt .d{color:var(--dim);font-size:11px;margin-top:2px}
.opt .r{font-size:10px;margin-top:2px}
.rC{color:var(--dim)} .rR{color:var(--cyan)} .rE{color:var(--purple)} .rL{color:var(--gold)}
.kbd{border:1px solid var(--dim);padding:0 4px;color:var(--cyan)}
.big{font-size:26px;color:var(--red);text-align:center;padding:10px 0}
.segv{background:#140000;border:1px solid var(--red);padding:10px;color:var(--red);white-space:pre-wrap;font-size:13px;margin:8px 0}
.hl{color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px}
table.t td,table.t th{border:1px solid var(--dim);padding:3px 5px;text-align:left}
table.t th{color:var(--amber);font-weight:400}
#ghost{position:fixed;z-index:500;pointer-events:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:1px solid var(--green);background:#0e140e;color:#fff;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <div id="status"></div>
  <div id="enemyZone"><div id="enemyList"></div></div>
  <div id="treeZone"><div id="treeInner"><svg id="treeLinks"></svg><div id="treeEmpty">// 表达式为空 — 从下方托盘拖入 token</div></div></div>
  <div id="editorZone">
    <div class="etabs" id="etabs"></div>
    <div id="exprRow"></div>
    <div id="tray"></div>
    <div id="evalLine">
      <span style="color:var(--dim)">damage =</span><span id="evalVal">0</span>
      <span id="evalNote"></span>
    </div>
    <div id="warnBox"></div>
    <div id="fnRow"></div>
    <div id="actRow"></div>
  </div>
  <div id="logZone"></div>
</div>
<div id="overlay"><div class="card" id="card"></div></div>
<div id="ghost" style="display:none"></div>

<script>
"use strict";
/* =========================================================
   CODE ROGUE — 单文件原型
   1. 表达式引擎   2. 数据表   3. 游戏状态   4. 战斗   5. 关卡   6. UI
   ========================================================= */

/* ---------------------- 0. 工具 ---------------------- */
const INT_MAX = 2147483647, INT_MIN = -2147483648;
const BIG = 1e18;
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function cl(v) { if (!isFinite(v)) return v > 0 ? BIG : -BIG; if (v > BIG) return BIG; if (v < -BIG) return -BIG; return Math.trunc(v); }
function fmt(n) {
  n = Math.trunc(n); const s = n < 0 ? '-' : ''; n = Math.abs(n);
  if (n < 10000) return s + n;
  if (n < 1e6) return s + (n / 1e3).toFixed(1) + 'K';
  if (n < 1e9) return s + (n / 1e6).toFixed(2) + 'M';
  return s + (n / 1e9).toFixed(2) + 'B';
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1);[a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------------------- 1. 表达式引擎 ---------------------- */
// 优先级（文档 7 章）：?: < | < ^ < & < << >> < + - < * / % < 一元 < **
const BIN = {
  '?:': { p: 1, right: true }, '|': { p: 3 }, '^': { p: 4 }, '&': { p: 5 },
  '<<': { p: 6 }, '>>': { p: 6 }, '+': { p: 7 }, '-': { p: 7 },
  '*': { p: 8 }, '/': { p: 8 }, '%': { p: 8 }, '**': { p: 10, right: true }
};
const UN = { '~': 9, '!': 9, '-': 9, '+': 9 };

function tokenize(ids, poolMap) { return ids.map(id => poolMap[id]).filter(Boolean); }

function parse(tokens) {
  let i = 0; const unmatched = [];
  function peek() { return tokens[i]; }
  function parseExpr(min) {
    let left = parseUn();
    for (; ;) {
      const t = peek(); if (!t || t.kind !== 'op') break;
      const info = BIN[t.label]; if (!info || info.p < min) break;
      i++; const idx = t._i;
      const right = parseExpr(info.right ? info.p : info.p + 1);
      left = { k: 'bin', op: t.label, l: left, r: right, idx };
    }
    return left;
  }
  function parseUn() {
    const t = peek();
    if (t && t.kind === 'op' && UN[t.label] !== undefined) {
      i++; const idx = t._i; const x = parseUn();
      return { k: 'un', op: t.label, x, idx };
    }
    return parseAtom();
  }
  function parseAtom() {
    const t = peek(); if (!t) return { k: 'err', idx: -1 };
    if (t.kind === 'paren' && t.label === '(') {
      i++; const idx = t._i; const e = parseExpr(0);
      const c = peek();
      if (c && c.kind === 'paren' && c.label === ')') i++; else unmatched.push(idx);
      return e;
    }
    if (t.kind === 'paren') { i++; return { k: 'err', idx: t._i }; }
    i++;
    if (t.kind === 'var') return { k: 'var', name: t.label, idx: t._i };
    if (t.kind === 'const') return { k: 'num', v: t.val || 0, idx: t._i, inf: !!t.inf, nan: !!t.nan };
    return { k: 'err', idx: t._i };
  }
  const root = parseExpr(0);
  return { root, consumed: i, unmatched };
}

function powi(a, b) {
  if (b < 0) return 0; if (b === 0) return 1; if (b > 1000) return BIG;
  let r = 1, base = a;
  while (b > 0) {
    if (b & 1) { r = cl(r * base); if (Math.abs(r) > BIG / 2) return BIG; }
    b >>= 1; if (b) { base = cl(base * base); if (Math.abs(base) > BIG / 2) return BIG; }
  }
  return r;
}
const b64 = f => { try { return Number(BigInt.asIntN(64, f(BigInt(Math.trunc(f.a)), BigInt(Math.trunc(f.b))))); } catch (e) { return 0; } };
function bitop(op, a, b) {
  a = cl(a); b = cl(b);
  if (Math.abs(a) > BIG / 2 || Math.abs(b) > BIG / 2) return 0;
  const A = BigInt(a), B = BigInt(b); let r;
  if (op === '&') r = A & B; else if (op === '|') r = A | B; else if (op === '^') r = A ^ B;
  else if (op === '<<') r = A << (B > 99n ? 99n : B); else r = A >> (B > 99n ? 99n : B);
  return Number(BigInt.asIntN(64, r));
}
function binop(op, a, b) {
  switch (op) {
    case '+': return cl(a + b);
    case '-': return cl(a - b);
    case '*': return cl(a * b);
    case '/': return b === 0 ? 0 : cl(Math.floor(a / b));
    case '%': return b === 0 ? 0 : cl(a % b);
    case '**': return powi(a, b);
    case '<<': case '>>': case '&': case '|': case '^': return cl(bitop(op, a, b));
    default: return cl(a + b);
  }
}
// ctx: {vars, frozen:Set(idx), lowHp:bool}
function ev(n, ctx) {
  if (!n) return 0;
  if (n.k === 'num') return ctx.frozen && ctx.frozen.has(n.idx) ? 0 : (n.inf ? Math.floor(ctx.infVal || 0) : n.v);
  if (n.k === 'var') return ctx.frozen && ctx.frozen.has(n.idx) ? 0 : (ctx.vars[n.name] || 0);
  if (n.k === 'un') {
    let x = ev(n.x, ctx); let op = n.op;
    if (ctx.frozen && ctx.frozen.has(n.idx)) op = '+';
    if (op === '-') return cl(-x);
    if (op === '+') return x;
    if (op === '!') return x === 0 ? 1 : 0;
    if (op === '~') return cl(bitop('^', x, -1));
    return x;
  }
  if (n.k === 'bin') {
    let op = n.op;
    if (ctx.frozen && ctx.frozen.has(n.idx)) op = '+';
    if (op === '?:') {
      // 语义：HP 低于 50% 取右侧（防御值），否则取左侧
      return ctx.lowHp ? ev(n.r, ctx) : ev(n.l, ctx);
    }
    const a = ev(n.l, ctx), b = ev(n.r, ctx);
    return binop(op, a, b);
  }
  return 0;
}
function evalTokens(ids, poolMap, ctx) {
  const toks = ids.map((id, k) => { const t = poolMap[id]; return t ? Object.assign({}, t, { _i: k }) : null; }).filter(Boolean);
  const { root, unmatched } = parse(toks);
  const v = Math.trunc(ev(root, ctx));
  return { v, root, unmatched, toks };
}
// token 预算消耗
function tokenCost(ids, poolMap) {
  let c = 0;
  for (const id of ids) { const t = poolMap[id]; if (!t) continue; c += (t.label === '?:' ? 3 : (t.cost || 1)); }
  return c;
}
function usedTokens() {
  let c = tokenCost(G.expr, TOK);
  for (const f of G.funcs) if (FUNCS[f] && FUNCS[f].p) c += tokenCost(G.params[f] || [], TOK);
  return c;
}
function effT() {
  let t = usedTokens() - (G.debtOffset || 0);
  return t < 0 ? 0 : t;
}
function trimTail(out) {
  while (out.length) {
    const last = TOK[out[out.length - 1]];
    if (last && (last.kind === 'op' || (last.kind === 'paren' && last.label === '('))) out.pop();
    else break;
  }
  return out;
}
function effBudget(ids, budget) {
  let c = 0; const out = [];
  for (const id of ids) {
    const t = TOK[id]; if (!t) continue;
    const cost = t.label === '?:' ? 3 : (t.cost || 1);
    if (c + cost > budget) break;
    c += cost; out.push(id);
  }
  return trimTail(out);
}
function cutIndex(ids, budget) {
  let c = 0, out = [];
  for (let i = 0; i < ids.length; i++) {
    const t = TOK[ids[i]]; if (!t) continue;
    const cost = t.label === '?:' ? 3 : (t.cost || 1);
    if (c + cost > budget) break;
    c += cost; out.push(ids[i]);
  }
  return trimTail(out).length;
}
function mainBudget() {
  let b = tokCap();
  for (const f of G.funcs) if (FUNCS[f] && FUNCS[f].p) b -= tokenCost(G.params[f] || [], TOK);
  return Math.max(0, b);
}
function debtReduce() {
  const t = effT();
  let r = t <= 8 ? 0 : t === 9 ? .10 : t === 10 ? .22 : t === 11 ? .36 : t === 12 ? .52 : t === 13 ? .70 : .90;
  if (G.relicHas('review')) r *= .5;
  if (G.refactored) r *= 0.7;
  return r;
}
function errChance() { const t = effT(); return t >= 14 ? .30 : t === 13 ? .15 : 0; }
function isSmelly() { return effT() >= 9; }

/* ---------------------- 2. 数据表 ---------------------- */
const TOK = {
  A: { kind: 'var', label: 'A', cost: 1 }, B: { kind: 'var', label: 'B', cost: 1 }, C: { kind: 'var', label: 'C', cost: 1 },
  PI: { kind: 'const', label: 'PI', val: 3, cost: 1 },
  MAXINT: { kind: 'const', label: 'MAX_INT', val: 2147483647, cost: 1 },
  NAN: { kind: 'const', label: 'NaN', val: 0, cost: 1, nan: true },
  INF: { kind: 'const', label: 'Infinity', val: 0, cost: 1, inf: true },
  DEAD: { kind: 'const', label: '0xDEAD', val: 57005, cost: 1 },
  TRUE: { kind: 'const', label: 'true', val: 1, cost: 1 },
  FALSE: { kind: 'const', label: 'false', val: 0, cost: 1 },
  c2: { kind: 'const', label: '2', val: 2, cost: 1 },
  c3: { kind: 'const', label: '3', val: 3, cost: 1 },
  c4: { kind: 'const', label: '4', val: 4, cost: 1 },
  c8: { kind: 'const', label: '8', val: 8, cost: 1 },
  LP: { kind: 'paren', label: '(', cost: 1 }, RP: { kind: 'paren', label: ')', cost: 1 },
  'op+': { kind: 'op', label: '+', cost: 1 }, 'op-': { kind: 'op', label: '-', cost: 1 },
  'op*': { kind: 'op', label: '*', cost: 1 }, 'op/': { kind: 'op', label: '/', cost: 1 },
  'op%': { kind: 'op', label: '%', cost: 1 }, 'op**': { kind: 'op', label: '**', cost: 1 },
  'op<<': { kind: 'op', label: '<<', cost: 1 }, 'op>>': { kind: 'op', label: '>>', cost: 1 },
  'op&': { kind: 'op', label: '&', cost: 1 }, 'op|': { kind: 'op', label: '|', cost: 1 },
  'op^': { kind: 'op', label: '^', cost: 1 }, 'op~': { kind: 'op', label: '~', cost: 1 },
  'op!': { kind: 'op', label: '!', cost: 1 }, 'op?:': { kind: 'op', label: '?:', cost: 3 }
};
const OPIDS = ['op+', 'op-', 'op*', 'op/', 'op%', 'op**', 'op<<', 'op>>', 'op&', 'op|', 'op^', 'op~', 'op!', 'op?:'];
const BINOPS = ['op+', 'op-', 'op*', 'op/', 'op%', 'op**', 'op<<', 'op>>', 'op&', 'op|', 'op^', 'op?:'];

const FUNCS = {
  defend: { name: 'defend(x)', mem: 2, p: 1, desc: '获得 x 点护盾（回合末衰减 50%）' },
  crit: { name: 'crit(x)', mem: 3, p: 1, desc: '本回合伤害 ×2.5；x 为奇数时 ×3.5' },

function computeDamage(target) {

    if (!FUNCS[f] || !FUNCS[f].p) continue;
    const ids = effBudget(G.params[f] || [], budget);
    budget -= tokenCost(ids, TOK);
    pvals[f] = Math.trunc(ev(evalTokens(ids, TOK, ctx).root, ctx));
  }

  G.unmatched = r.unmatched.length;
  G.lastRoot = r.root;
  const detail = { v, extra: 0, throwd: 0, notes: [] };
  // （参数求值已在上方按共享预算完成）
  // crit
  let mul = 1;
  if (G.active.crit) { const x = Math.abs(pvals.crit || 0); mul *= (x % 2 === 1 ? 3.5 : 2.5); detail.notes.push('crit ×' + mul); }
  if (G.active.recursive) { const n = clamp(Math.trunc(pvals.recursive || 1), 1, 3); detail.notes.push('recursive ^' + n); detail.recN = n; }
  if (G.turn === 0 && relicHas('cicd')) { mul *= 3; detail.notes.push('CI/CD ×3'); }
  if (relicHas('proddirect')) { mul *= 2; detail.notes.push('prod ×2'); }
  if (G.typed && relicHas('keyboard')) mul *= 1.15;
  let base = v * mul;
  // 递归累乘
  if (detail.recN) { let t = base; for (let i = 1; i < detail.recN; i++) t = cl(t * base); base = t; }
  // 附加
  if (G.active.map) detail.extra += (pvals.map || 0) * varCount();
  if (G.active.filter) detail.extra += (pvals.filter || 0) * varCount() * .75;
  if (G.active.reduce) detail.extra += (pvals.reduce || 0) * varCount() * 1.5;
  if (G.active.throwf) detail.throwd += Math.abs(pvals.throwf || 0);
  if (G.memoVal) detail.extra += Math.floor(G.memoVal * .6);
  if (G.induce) { base += (G.vars.A || 0); detail.notes.push('induced +' + G.vars.A); }
  let dmg = cl(base + detail.extra);
  if (relicHas('bigint')) dmg = Math.floor(dmg * .6);
  // 溢出
  const cap = relicHas('unsigned') ? 4294967295 : INT_MAX;
  let over = 0;
  if (!relicHas('bigint') && dmg > cap) {
    if (relicHas('unsigned') && dmg > 4294967295) { over = dmg - 4294967295; dmg = cl(dmg % 4294967296); if (dmg > cap) { over = dmg - cap; dmg = cap; } }
    else if (relicHas('limiter')) { over = dmg - cap; detail.limited = over; dmg = cap; detail.notes.push('limiter: ' + fmt(over) + ' → shield'); }

function applyDamageTo(e, detail) {

  const dr = debtReduce();

  const armor = (G.active.refactor ? 0 : (e.armor || 0));
  dmg = Math.floor(dmg * (1 - armor));
  // Boss2 掩码
  if (e.d.id === 'b2' && e.mask != null && !G.active.refactor) {
    let ok = false;
    for (let i = 0; i < 4; i++) if ((e.mask >> i) & 1) if ((dmg >> i) & 1) ok = true;
    if (!ok) { dmg = Math.floor(dmg * .1); log('  // bitmask miss — 90% absorbed', 'lw'); }
  }
  // Boss3 熔断
  if (e.d.id === 'b3' && e.hp < e.maxHp * .33) {
    e.cap = Math.max(5e7, Math.floor((e.best || 0) * 1.5));
    if (dmg > e.cap) { const ex = dmg - e.cap; e.shieldE = (e.shieldE || 0) + ex; dmg = e.cap; log('  // CIRCUIT BREAKER: ' + fmt(ex) + ' → shield', 'le'); }
  }
  // Boss 护盾（熔断转化）
  if (e.shieldE) {
    const ab = Math.min(e.shieldE, dmg); e.shieldE -= ab; dmg -= ab;
    if (ab) log('  // breaker shield absorbed ' + fmt(ab), 'lw');

  // Act III 限流
  if (G.floor >= 9 && !e.d.boss) { const lim = Math.floor(e.maxHp * .3); if (dmg > lim) { log('  // rate limiter: capped at 30% max HP', 'lw'); dmg = lim; } }

  if (G.turn > 30) { const k = 1 + (G.turn - 30) * .25; dmg = Math.floor(dmg * k); if (G.turn === 31) log('  // watchdog: 战斗超过 30 回合，伤害开始膨胀', 'lw'); }
  if (dmg < 0) dmg = 0;
  // 溢出回血
  if (detail.limited) { G.shield += Math.floor(detail.limited * .1); }
  if (detail.over > 0) {
    const heal = Math.floor(detail.over * (e.healMul || 1));
    e.hp = Math.min(e.maxHp, e.hp + heal);
    G.stats.overflow++;
    log('!! INTEGER OVERFLOW — ' + e.name + ' healed ' + fmt(heal), 'le');
    dmg = 0; detail.over = 0;
  }
  e.best = Math.max(e.best || 0, dmg);
  e.hp -= dmg;
  G.stats.best = Math.max(G.stats.best, dmg);
  // throw 无视一切

}

/* ---------------------- 键盘输入 ---------------------- */
function numTok(n) {
  const id = 'n' + n;
  if (!TOK[id]) { TOK[id] = { kind: 'const', label: n, val: parseInt(n, 10), cost: 1 }; }
  if (!G.pool.includes(id)) G.pool.push(id);
  return id;
}
function parseInput(s) {
  s = s.replace(/\s+/g, '');
  const ids = []; let i = 0;
  while (i < s.length) {
    if (s.substr(i, 2) === 'PI') { if (G.pool.includes('PI')) ids.push('PI'); i += 2; continue; }
    const c = s[i];
    if (/[A-C]/.test(c)) { if (G.unlocked.includes(c)) ids.push(c); i++; continue; }
    if (/[0-9]/.test(c)) { let n = ''; while (i < s.length && /[0-9]/.test(s[i])) { n += s[i]; i++; } ids.push(numTok(n)); continue; }
    const two = s.substr(i, 2);
    if (['**', '<<', '>>', '?:'].indexOf(two) >= 0) { ids.push('op' + two); i += 2; continue; }
    if ('+-*/%&|^~!'.indexOf(c) >= 0) { ids.push('op' + c); i++; continue; }
    if (c === '(') { ids.push('LP'); i++; continue; }
    if (c === ')') { ids.push('RP'); i++; continue; }
    i++;
  }
  return ids;
}
function keyboardInput() {
  const s = prompt('输入表达式（例：(A+A)*3 ）\n可用变量：' + G.unlocked.join(',') + '  可用运算符见托盘', G.expr.map(i => TOK[i].label).join(''));
  if (s == null) return;
  const ids = parseInput(s);
  if (!ids.length) { log('// 无法解析', 'lw'); return; }
  curExpr().length = 0; ids.forEach(x => curExpr().push(x));
  G.typed = true;
  log('> typed: ' + ids.map(i => TOK[i].label).join(' '), 'lc');
  render();
}

/* ---------------------- 自动格式化 ---------------------- */
function autoFormat(apply) {
  const cap = (G.editTarget === 'main' ? mainBudget() : tokCap()), V = G.unlocked[0], B = G.unlocked[1];
  const cands = [];
  const push = ids => { if (ids.every(x => G.pool.includes(x)) && tokenCost(ids, TOK) <= cap) cands.push(ids); };
  push([V]); push([V, 'op+', V]); push([V, 'op+', V, 'op+', V]); push([V, 'op*', V]);
  push(['LP', V, 'op+', V, 'RP', 'op*', V]);
  push(['LP', V, 'op+', V, 'RP', 'op*', 'LP', V, 'op+', V, 'RP']);
  push(['LP', V, 'op*', V, 'RP', 'op*', V]);
  push(['LP', V, 'op*', V, 'RP', 'op*', 'LP', V, 'op*', V, 'RP']);
  push(['LP', V, 'op+', V, 'RP', 'op**', 'c2']);
  push([V, 'op**', 'c3']); push([V, 'op**', 'c4']); push([V, 'op<<', 'c4']); push([V, 'op<<', 'c3']);
  push(['LP', V, 'op+', V, 'RP', 'op*', 'c3']);
  push(['LP', V, 'op*', V, 'RP', 'op*', 'LP', V, 'op+', V, 'RP']);
  push(['LP', V, 'op*', V, 'RP', 'op*', V, 'op<<', 'c4']);
  push(['LP', V, 'op*', V, 'RP', 'op*', 'LP', V, 'op+', V, 'RP', 'op<<', 'c3']);
  push(['LP', V, 'op*', V, 'RP', 'op*', 'LP', V, 'op+', V, 'RP', 'op>>', 'c2']);
  if (B) { push([V, 'op+', B]); push(['LP', V, 'op+', B, 'RP', 'op*', V]); push(['LP', V, 'op+', B, 'RP', 'op*', 'LP', V, 'op+', B, 'RP']); push([V, 'op*', B]); push(['LP', V, 'op*', B, 'RP', 'op*', 'LP', V, 'op+', B, 'RP']); }
  const q = [V, 'op*', V, 'op*', V, 'op*', V];
  push(q);
  ['op>>', 'op/', 'op<<'].forEach(sh => { ['c2', 'c3', 'c4', 'c8'].forEach(c => { push(q.concat([sh, c])); }); });
  ['op+', 'op-', 'op%'].forEach(sh => { ['c2', 'c3', 'c4', 'c8'].forEach(c => { push(q.concat([sh, c])); }); });
  let best = null, bv = -1;
  const capOk = relicHas('bigint') ? Infinity : (relicHas('unsigned') ? 4294967295 : INT_MAX);
  for (const c of cands) {
    const r = evalTokens(c, TOK, evalCtx(alive()[0] ? alive()[0].hp : 0));
    let v = r.v; if (r.toks.some(t => t.nan)) v = 0;
    if (v > capOk || v < 0) continue;
    const dr = debtReduce();
    const score = Math.floor(v * (1 - dr));
    if (score > bv) { bv = score; best = c; }
  }
  if (!best) { log('// 没有更优解', 'lw2'); return; }
  const str = best.map(i => TOK[i].label).join(' ');
  if (apply) { curExpr().length = 0; best.forEach(x => curExpr().push(x)); log('> auto-format → ' + str + ' = ' + fmt(bv), 'lc'); render(); }
  else log('// -O2 建议：' + str + ' = ' + fmt(bv), 'lc');
}

function weightOf(r) {
  const f = G.floor;
  if (f <= 4) return r === 'C' ? 70 : r === 'R' ? 28 : r === 'E' ? 2 : 0;
  if (f <= 8) return r === 'C' ? 40 : r === 'R' ? 45 : r === 'E' ? 14 : 1;
  return r === 'C' ? 15 : r === 'R' ? 40 : r === 'E' ? 35 : 10;
}
function rollChoices(n, forceRare) {

  const out = [], cats = {};

    let x = Math.random() * tot, it = p[0];

    if (out.some(o => o.id === it.id && !it.dyn)) continue;

}

  });
  gaps.forEach(g => g.classList.remove('hot'));
  if (best && bd < 260) { best.classList.add('hot'); drag.gap = +best.dataset.i; }
  else drag.gap = null;
}
document.addEventListener('mousedown', e => {
  const tk = e.target.closest ? e.target.closest('.tk') : null;
  if (!tk) return;
  drag = { from: tk.dataset.src, id: tk.dataset.pool, idx: tk.dataset.i !== undefined ? +tk.dataset.i : -1, x: e.clientX, y: e.clientY, moved: false, node: tk, gap: null };
  e.preventDefault();
});
document.addEventListener('mousemove', e => {
  if (!drag) return;
  if (Math.abs(e.clientX - drag.x) > 4 || Math.abs(e.clientY - drag.y) > 4) drag.moved = true;
  if (!drag.moved) return;
  const gh = $('#ghost'); gh.style.display = 'flex';
  gh.style.left = (e.clientX - 13) + 'px'; gh.style.top = (e.clientY - 13) + 'px';
  const lbl = drag.from === 'tray' ? (TOK[drag.id] ? TOK[drag.id].label : '') : (TOK[curExpr()[drag.idx]] ? TOK[curExpr()[drag.idx]].label : '');
  gh.textContent = lbl;
  drag.node.classList.add('dragging');
  highlightGap(e.clientX, e.clientY);
});
document.addEventListener('mouseup', e => {
  if (!drag) return;
  $('#ghost').style.display = 'none';
  drag.node.classList.remove('dragging');
  const row = $('#exprRow').getBoundingClientRect();
  const inside = e.clientX >= row.left - 20 && e.clientX <= row.right + 20 && e.clientY >= row.top - 50 && e.clientY <= row.bottom + 50;
  const arr = curExpr();
  if (!drag.moved) {
    if (drag.from === 'tray') arr.push(drag.id);
    else if (drag.idx >= 0 && drag.idx < arr.length) arr.splice(drag.idx, 1);
  } else if (drag.from === 'tray') {
    if (inside) arr.splice(drag.gap != null ? drag.gap : arr.length, 0, drag.id);
    else arr.push(drag.id);
  } else {
    if (!inside) { if (drag.idx >= 0 && drag.idx < arr.length) arr.splice(drag.idx, 1); }
    else {
      const g = drag.gap != null ? drag.gap : arr.length;
      const [it] = arr.splice(drag.idx, 1);
      const to = g > drag.idx ? g - 1 : g;
      arr.splice(clamp(to, 0, arr.length), 0, it);
    }
  }
  drag = null; render();
});

/* ---------------------- 键盘 ---------------------- */
document.addEventListener('keydown', e => {
  if ($('#overlay').classList.contains('on')) {
    if (e.key === ' ' || e.key === 'Enter') { const b = $('#card').querySelector('.opt'); if (b) b.click(); e.preventDefault(); }
    return;
  }
  if (e.key === ' ') { playerTurn(); e.preventDefault(); }
  if (e.key === 'Tab') { autoFormat(true); e.preventDefault(); }
});

/* ---------------------- 启动 ---------------------- */
function boot() {
  G.owned = {}; G.baseDmg = 6; G.hpBonus = 0; G.debtOffset = 0; G.unitUsed = false;
  overlay('CODE ROGUE', 'a roguelike where your damage is a line of code',
    '<div class="segv" style="border-color:var(--green);color:var(--green);background:#04180a">$ ./code_rogue --new-run\n[ OK ] linking libc.......\n[ OK ] loading tokens.....\n[WARN] 3 vulnerabilities found\n\n&gt; let A = 5\n&gt; damage = A</div>' +
    '<div class="sub">你不抽卡、不打牌。你的攻击力是一段由你拼装的表达式。\n敌人是 bug，它们会删你的变量、改你的运算符、骗你溢出。\n\n黑底绿字，全程鼠标拖拽，不需要会写代码。</div>',
    [{ t: '▶ 开始', d: '按 SPACE 或点击', run: startTutorial }], true);
  render();
}
function startTutorial() {
  hideOverlay();
  log('$ ./code_rogue --new-run --class=python', 'lc');
  log('[ OK ] linking libc........................', 'lw2');
  log('[ OK ] loading tokens......................', 'lw2');
  log('[WARN] 3 vulnerabilities found', 'lw');
  log('> let A = 5', 'lwh');
  log('> damage = A', 'lw2');
  G.tut = 1;
  setTimeout(tutStep, 350);
}
function tutFinish() {
  G.tut = 5;
  overlay('你学会了运算优先级', '',
    '<div class="segv" style="border-color:var(--green);color:var(--green);background:#04180a">1 + 2 * 3 = 7, not 9.\n* binds tighter than +.</div>' +
    '<div class="sub">上方那棵树就是你的代码。下面的文本只是它的显示形式。\n以后每次改动，三者实时同步。</div>' +
    '<div class="sub">[ACHIEVEMENT] Order of Operations — "1 + 2 * 3 = 7, not 9"</div>',
    [{ t: '继续（进入第 1 层）', d: '', run: () => { G.tut = 6; startFloor(1, 3); } }]);
}
boot();
</script>
